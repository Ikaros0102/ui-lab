<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-bit Pixel Menu</title>

<!-- Fonts: Press Start 2P from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<script type="application/json" data-uilab-meta>

  "title": "8-bit Pixel Menu",

  "description": "Arcade 8-bit game main menu with stepped pixel border shadows, blinking cursor arrow, and keyboard navigation.",
  "techniques": ["box-shadow pixel-art border", "Press Start 2P font", "image-rendering: pixelated", "keyboard arrow navigation", "steps(1) blinking arrow"],
  "recipe": "Пиксельная рамка вокруг меню строится через каскадный `box-shadow` без размытия, имитирующий уступчатые пиксели. Курсор (мигающий треугольник) управляется клавишами Up/Down/Enter с дискретной анимацией через `steps(1)`.",
  "preview": { "mode": "page", "width": 860, "height": 620 }

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0d0c18;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
    overflow: hidden;
    padding: 20px;
  }

  .game-container {
    background: #19182d;
    padding: 48px 60px;
    position: relative;
    text-align: center;
    /* 8-bit stepped pixel border using box-shadow */
    box-shadow:
      0 -4px 0 0 #3b3966,
      0 4px 0 0 #3b3966,
      -4px 0 0 0 #3b3966,
      4px 0 0 0 #3b3966,
      -8px 0 0 0 #0d0c18,
      8px 0 0 0 #0d0c18,
      0 -8px 0 0 #0d0c18,
      0 8px 0 0 #0d0c18,
      0 0 0 4px #0d0c18,
      0 0 0 8px #595696,
      0 0 0 12px #0d0c18;
  }

  h1 {
    font-size: 24px;
    line-height: 1.5;
    margin: 0 0 40px;
    color: #fcee0a;
    text-shadow: 4px 4px 0 #b3003b;
    letter-spacing: -1px;
  }

  .menu-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .menu-item {
    position: relative;
    font-size: 14px;
    color: #a5a2dd;
    cursor: pointer;
    padding: 6px 12px;
    user-select: none;
    transition: color 0.1s;
  }

  .menu-item:hover,
  .menu-item.active {
    color: #ffffff;
    text-shadow: 2px 2px 0 #7b2cbf;
  }

  .menu-item.active::before {
    content: "▶";
    position: absolute;
    left: -24px;
    color: #fcee0a;
    animation: blink 0.7s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .footer-hints {
    margin-top: 36px;
    font-size: 9px;
    color: #6a679e;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="game-container">
  <h1>CYBER STRIKE 1984</h1>

  <ul class="menu-list" id="menu">
    <li class="menu-item active" data-index="0">START GAME</li>
    <li class="menu-item" data-index="1">STAGE SELECT</li>
    <li class="menu-item" data-index="2">SOUND TEST</li>
    <li class="menu-item" data-index="3">CREDITS</li>
  </ul>

  <div class="footer-hints">
    USE [↑] [↓] KEYS OR MOUSE TO SELECT<br>
    PRESS [ENTER] TO EXECUTE
  </div>
</div>

<script>
  const items = Array.from(document.querySelectorAll('.menu-item'));
  let activeIndex = 0;

  function setActive(idx) {
    items[activeIndex].classList.remove('active');
    activeIndex = (idx + items.length) % items.length;
    items[activeIndex].classList.add('active');
  }

  items.forEach((item, idx) => {
    item.addEventListener('mouseenter', () => setActive(idx));
    item.addEventListener('click', () => {
      setActive(idx);
      alert(`SELECTED: ${item.textContent}`);
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive(activeIndex - 1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive(activeIndex + 1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      alert(`SELECTED: ${items[activeIndex].textContent}`);
    }
  });
</script>

</body>
</html>
