<html lang="en">
<head>
<meta charset="UTF-8">

<title>UNSC PLN-ECHO-216 — Avionics Comm Terminal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

  ],
  "description": "True-to-reference UNSC PLN-ECHO-216 Avionics Comm Terminal. Features vertical brushed dark olive-slate cockpit texture, pale icy seafoam-mint CRT wireframe borders, dual radio modules with lime-green sine oscilloscope and tight amber RF laser-noise trace, clustered telemetry ticks, bracketed frequency/channel selectors, and MFD bezel softkeys.",
  "preview": {

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --bg-cockpit: #080a09;
    --bezel-bg: #0c0f0e;
    --mint-wire: #9ec9c2;
    --mint-bright: #ccebe5;
    --mint-dim: rgba(158, 201, 194, 0.25);
    --mint-glow: rgba(168, 218, 210, 0.32);

    --lime-wave: #a3e635;
    --lime-glow: rgba(163, 230, 53, 0.55);

    --amber-rf: #f97316;
    --amber-core: #fed7aa;
    --amber-glow: rgba(249, 115, 22, 0.6);
  }

  body {
    min-height: 100vh;
    background-color: var(--bg-cockpit);
    font-family: 'Share Tech Mono', monospace;
    color: var(--mint-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .mfd-chassis {
    width: 100%;
    max-width: 860px;
    aspect-ratio: 1 / 1;
    background-color: var(--bezel-bg);
    background-image:
      radial-gradient(circle at 50% 45%, rgba(28, 38, 36, 0.65) 0%, rgba(8, 10, 9, 0.96) 75%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);
    border: 1.5px solid #1e2624;
    box-shadow:
      0 28px 70px rgba(0,0,0,0.9),
      inset 0 0 60px rgba(0,0,0,0.85);
    padding: 46px 64px 28px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Outer subtle bezel wireframe */
  .bezel-inner-frame {
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(158, 201, 194, 0.14);
    pointer-events: none;
  }

  /* Scanline overlay */
  .crt-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.22) 50%);
    background-size: 100% 3px;
    z-index: 40;
    opacity: 0.65;
  }

  /* Side bezel ticks */
  .side-ticks {
    position: absolute;
    top: 22%;
    bottom: 22%;
    width: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
  }
  .side-ticks.left { left: 26px; align-items: flex-start; }
  .side-ticks.right { right: 26px; align-items: flex-end; }
  .tick-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .tick-group span {
    width: 8px;
    height: 1px;
    background: rgba(158, 201, 194, 0.3);
  }
  .tick-group span.long { width: 13px; }

  .terminal-body {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 28px;
    margin-top: 12px;
  }

  /* ========================================================
     COMM MODULE BOX (MATCHING REFERENCE 3)
     ======================================================== */
  .comm-module {
    border: 1px solid var(--mint-wire);
    box-shadow:
      0 0 14px rgba(158, 201, 194, 0.16),
      inset 0 0 18px rgba(158, 201, 194, 0.06);
    background: rgba(10, 14, 13, 0.72);
    display: flex;
    flex-direction: column;
  }

  /* Top compartment label strip */
  .module-header-strip {
    border-bottom: 1px solid rgba(158, 201, 194, 0.35);
    padding: 5px 12px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--mint-wire);
    text-transform: uppercase;
  }

  /* Frequency Row */
  .freq-bar {
    display: grid;
    grid-template-columns: 112px 1fr 112px;
    border-bottom: 1px solid var(--mint-wire);
    align-items: center;
    height: 62px;
  }

  .bar-side-cell {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--mint-wire);
  }
  .bar-side-cell:last-child {
    border-right: none;
    border-left: 1px solid var(--mint-wire);
  }

  .status-pill-btn {
    border: 1px solid var(--mint-wire);
    padding: 2px 12px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(158, 201, 194, 0.1);
    cursor: pointer;
  }
  .status-pill-btn.stby {
    border-color: rgba(158, 201, 194, 0.55);
    color: var(--mint-wire);
    background: transparent;
  }

  .freq-center-readout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .tri-arrow {
    color: var(--lime-wave);
    font-size: 12px;
    cursor: pointer;
    text-shadow: 0 0 6px var(--lime-glow);
  }
  .freq-digits {
    font-size: 27px;
    letter-spacing: 10px;
    color: #eef7f5;
    text-shadow: 0 0 10px rgba(238, 247, 245, 0.5);
  }

  /* Viewport */
  .scope-viewport {
    height: 124px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(16, 23, 22, 0.5) 0%, rgba(8, 12, 11, 0.85) 100%);
  }
  .scope-center-axis {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(158, 201, 194, 0.2);
  }
  .scope-v-axis {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(158, 201, 194, 0.18);
  }

  /* Clustered Ruler Ticks */
  .tick-cluster-bar {
    position: absolute;
    left: 16px;
    right: 16px;
    height: 6px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .tick-cluster-bar.bottom { bottom: 2px; }
  .tick-cluster-bar.mid { top: calc(50% - 3px); }

  .t-cluster {
    display: flex;
    gap: 3px;
  }
  .t-cluster span {
    width: 1px;
    height: 5px;
    background: rgba(204, 235, 229, 0.65);
  }
  .tick-cluster-bar.amber .t-cluster span {
    background: rgba(249, 115, 22, 0.85);
    box-shadow: 0 0 4px var(--amber-glow);
  }

  .waveform-canvas {
    width: 100%;
    height: 100%;
    display: block;
    position: relative;
    z-index: 5;
  }

  /* ========================================================
     BOTTOM SELECTORS (BRACKETED GROUPS)
     ======================================================== */
  .selectors-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 8px;
  }

  .selector-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bracket-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 9.5px;
    letter-spacing: 2.5px;
    color: var(--mint-wire);
  }
  .bracket-label::before, .bracket-label::after {
    content: '';
    flex: 1;
    height: 5px;
    border-top: 1px solid rgba(158, 201, 194, 0.45);
  }
  .bracket-label::before { border-left: 1px solid rgba(158, 201, 194, 0.45); }
  .bracket-label::after { border-right: 1px solid rgba(158, 201, 194, 0.45); }

  .band-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .band-btn {
    border: 1px solid rgba(158, 201, 194, 0.28);
    background: rgba(12, 16, 15, 0.75);
    color: rgba(158, 201, 194, 0.55);
    padding: 13px 0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .band-btn:hover {
    border-color: var(--mint-wire);
    color: var(--mint-bright);
  }
  .band-btn.active {
    border: 1.5px solid var(--mint-bright);
    color: #fff;
    background: rgba(158, 201, 194, 0.12);
    box-shadow: 0 0 12px var(--mint-glow), inset 0 0 8px rgba(158, 201, 194, 0.15);
  }

  /* ========================================================
     BOTTOM MFD SOFTKEYS + INDICATOR TABS
     ======================================================== */
  .bezel-softkeys-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 12px 0;
    font-size: 10.5px;
    letter-spacing: 2.5px;
    color: #546662;
    position: relative;
    z-index: 10;
  }
  .softkey-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .softkey-item:hover {
    color: var(--mint-wire);
  }
  .softkey-tab {
    width: 34px;
    height: 3px;
    background: transparent;
  }
  .softkey-tab.lit {
    background: rgba(158, 201, 194, 0.45);
    box-shadow: 0 0 6px var(--mint-glow);
  }

</style>
</head>
<body>

<div class="mfd-chassis">
  <div class="bezel-inner-frame"></div>
  <div class="crt-overlay"></div>

  <div class="side-ticks left">
    <div class="tick-group"><span></span><span class="long"></span><span></span></div>
    <div class="tick-group"><span></span><span class="long"></span><span></span></div>
  </div>
  <div class="side-ticks right">
    <div class="tick-group"><span></span><span class="long"></span><span></span></div>
    <div class="tick-group"><span></span><span class="long"></span><span></span></div>
  </div>

  <div class="terminal-body">

    <!-- MODULE 1: UNSC PLN-ECHO-216 -->
    <div class="comm-module">
      <div class="module-header-strip">UNSC PLN-ECHO-216</div>

      <div class="freq-bar">
        <div class="bar-side-cell"><button class="status-pill-btn">ACT</button></div>
        <div class="freq-center-readout">
          <span class="tri-arrow" id="f1Down">▶</span>
          <span class="freq-digits" id="f1Val">227.250</span>
          <span class="tri-arrow" id="f1Up">◀</span>
        </div>
        <div class="bar-side-cell"><button class="status-pill-btn">ACT</button></div>
      </div>

      <div class="scope-viewport">
        <div class="scope-center-axis"></div>
        <div class="scope-v-axis"></div>
        <canvas class="waveform-canvas" id="sineCanvas"></canvas>
        <div class="tick-cluster-bar bottom">
          <div class="t-cluster"><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- MODULE 2: IFF TAG - FRIENDLY -->
    <div class="comm-module">
      <div class="module-header-strip">IFF TAG - FRIENDLY</div>

      <div class="freq-bar">
        <div class="bar-side-cell"><button class="status-pill-btn stby">STBY</button></div>
        <div class="freq-center-readout">
          <span class="freq-digits" id="f2Val">376.750</span>
        </div>
        <div class="bar-side-cell"><button class="status-pill-btn stby">STBY</button></div>
      </div>

      <div class="scope-viewport">
        <div class="scope-center-axis"></div>
        <div class="scope-v-axis"></div>
        <div class="tick-cluster-bar mid amber">
          <div class="t-cluster"><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span></div>
        </div>
        <canvas class="waveform-canvas" id="noiseCanvas"></canvas>
        <div class="tick-cluster-bar bottom">
          <div class="t-cluster"><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span></div>
          <div class="t-cluster"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- FREQUENCY & CHANNELS -->
    <div class="selectors-area">
      <div class="selector-group">
        <div class="bracket-label">FREQUENCY</div>
        <div class="band-row">
          <button class="band-btn">VHF1</button>
          <button class="band-btn active">UHF1</button>
          <button class="band-btn">SHF1</button>
        </div>
      </div>

      <div class="selector-group">
        <div class="bracket-label">CHANNELS</div>
        <div class="band-row">
          <button class="band-btn">VHF2</button>
          <button class="band-btn">UHF2</button>
          <button class="band-btn">SHF2</button>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM MFD BEZEL KEYS -->
  <div class="bezel-softkeys-bar">
    <div class="softkey-item"><span>OK</span><div class="softkey-tab"></div></div>
    <div class="softkey-item"><span>FDAI</span><div class="softkey-tab lit"></div></div>
    <div class="softkey-item"><span>MFD</span><div class="softkey-tab lit"></div></div>
    <div class="softkey-item"><span>RDR</span><div class="softkey-tab lit"></div></div>
    <div class="softkey-item"><span>NAV</span><div class="softkey-tab"></div></div>
  </div>
</div>

<script>
  const sineCanvas = document.getElementById('sineCanvas');
  const sCtx = sineCanvas.getContext('2d');
  const noiseCanvas = document.getElementById('noiseCanvas');
  const nCtx = noiseCanvas.getContext('2d');

  function resize() {
    sineCanvas.width = sineCanvas.clientWidth * window.devicePixelRatio;
    sineCanvas.height = sineCanvas.clientHeight * window.devicePixelRatio;
    noiseCanvas.width = noiseCanvas.clientWidth * window.devicePixelRatio;
    noiseCanvas.height = noiseCanvas.clientHeight * window.devicePixelRatio;
  }
  window.addEventListener('resize', resize);
  resize();

  let phase = 0;

  function draw() {
    const sw = sineCanvas.width, sh = sineCanvas.height;
    sCtx.clearRect(0, 0, sw, sh);

    // Outer green phosphor glow
    sCtx.strokeStyle = '#84cc16';
    sCtx.lineWidth = 4 * window.devicePixelRatio;
    sCtx.shadowColor = '#a3e635';
    sCtx.shadowBlur = 14 * window.devicePixelRatio;

    const drawSine = () => {
      sCtx.beginPath();
      const padX = sw * 0.04;
      const amp = sh * 0.21;
      const cy = sh * 0.5;
      const cycles = 7.5;
      for (let x = padX; x <= sw - padX; x++) {
        const t = (x - padX) / (sw - 2 * padX);
        const y = cy + Math.sin(t * Math.PI * 2 * cycles + phase) * amp;
        if (x === padX) sCtx.moveTo(x, y);
        else sCtx.lineTo(x, y);
      }
      sCtx.stroke();
    };
    drawSine();

    // Bright white-lime core
    sCtx.strokeStyle = '#ecfccb';
    sCtx.lineWidth = 1.4 * window.devicePixelRatio;
    sCtx.shadowBlur = 0;
    drawSine();

    // Dense tight orange RF laser-noise line
    const nw = noiseCanvas.width, nh = noiseCanvas.height;
    nCtx.clearRect(0, 0, nw, nh);
    const nPadX = nw * 0.03;
    const nCy = nh * 0.78;

    nCtx.strokeStyle = '#f97316';
    nCtx.lineWidth = 2.5 * window.devicePixelRatio;
    nCtx.shadowColor = '#fb923c';
    nCtx.shadowBlur = 12 * window.devicePixelRatio;

    nCtx.beginPath();
    for (let x = nPadX; x <= nw - nPadX; x += 1.5) {
      const jitter = (Math.random() - 0.5) * (nh * 0.055);
      const y = nCy + jitter;
      if (x === nPadX) nCtx.moveTo(x, y);
      else nCtx.lineTo(x, y);
    }
    nCtx.stroke();

    // Bright peach core
    nCtx.strokeStyle = '#ffedd5';
    nCtx.lineWidth = 1 * window.devicePixelRatio;
    nCtx.shadowBlur = 0;
    nCtx.beginPath();
    nCtx.moveTo(nPadX, nCy);
    nCtx.lineTo(nw - nPadX, nCy);
    nCtx.stroke();

    phase += 0.04;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  document.querySelectorAll('.band-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('.band-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  let f1 = 227.250;
  document.getElementById('f1Up').addEventListener('click', () => {
    f1 += 0.025;
    document.getElementById('f1Val').textContent = f1.toFixed(3);
  });
  document.getElementById('f1Down').addEventListener('click', () => {
    f1 -= 0.025;
    document.getElementById('f1Val').textContent = f1.toFixed(3);
  });
</script>

</body>
