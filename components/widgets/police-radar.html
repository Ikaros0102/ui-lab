<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Police Radar HUD</title>

<!-- Digital Font DSEG7 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css">

<script type="application/json" data-uilab-meta>
{
  "title": "Tactical Police Radar HUD",
  "category": "widgets",
  "themes": [
    "retro",
    "dark"
  ],
  "tags": [
    "radar",
    "police",
    "hud",
    "speed",
    "doppler",
    "military",
    "dseg7",
    "lcd",
    "telemetry"
  ],
  "description": "Handheld police Doppler speed radar interface: sweep scope, speed lock, digital 7-segment readout, and audio-visual violation alert.",
  "techniques": [
    "DSEG7 7-segment font",
    "conic-gradient radar sweep",
    "polar coordinate targets",
    "over-speed warning strobe",
    "LCD ghost segment display"
  ],
  "recipe": "The police Doppler radar combines an active 360-degree sweep scope (conic-gradient beam with target blips) and a dual-layer DSEG7 digital speed readout. Exceeding the speed limit triggers an attention-grabbing strobing VIOLATION / LOCKED status alert.",
  "preview": {
    "mode": "page",
    "width": 860,
    "height": 720
  }
}
</script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #06090e;
    color: #e2e8f0;
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .radar-unit {
    width: 100%;
    max-width: 780px;
    background: linear-gradient(175deg, #161c28 0%, #0d121c 100%);
    border: 2px solid #283347;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 
      0 30px 70px rgba(0, 0, 0, 0.8),
      inset 0 1px 1px rgba(255, 255, 255, 0.15),
      0 0 0 1px #05070a;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    position: relative;
  }

  @media (max-width: 760px) {
    .radar-unit { grid-template-columns: 1fr; }
  }

  /* Left Panel: Scope Display */
  .scope-box {
    background: #070d14;
    border: 2px solid #1f2b3e;
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
  }

  .scope-circle {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.3);
    background: 
      radial-gradient(circle, rgba(56, 189, 248, 0.05) 1px, transparent 1px) 0 0 / 20px 20px,
      radial-gradient(circle at center, transparent 30%, rgba(14, 165, 233, 0.08) 70%, transparent 71%);
  }

  /* Concentric distance rings */
  .scope-circle::before {
    content: "";
    position: absolute;
    inset: 35px;
    border-radius: 50%;
    border: 1px dashed rgba(56, 189, 248, 0.25);
  }

  /* Rotating radar beam */
  .scope-beam {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 75%, rgba(14, 165, 233, 0.5) 100%);
    animation: sweep 2.5s linear infinite;
  }

  /* Crosshairs */
  .cross-h {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(56, 189, 248, 0.25);
  }
  .cross-v {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(56, 189, 248, 0.25);
  }

  /* Blips / targets */
  .blip {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444;
    animation: blipPulse 1.2s infinite ease-out;
  }
  .blip-1 { top: 35%; left: 65%; }
  .blip-2 { top: 70%; left: 30%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }

  @keyframes sweep { to { transform: rotate(360deg); } }
  @keyframes blipPulse {
    0% { transform: scale(0.8); opacity: 0.4; }
    50% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0.4; }
  }

  .scope-footer {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #38bdf8;
  }

  /* Right Panel: Telemetry Readouts */
  .telemetry-box {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .brand-bar h3 {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: #94a3b8;
  }
  .band-tag {
    font-size: 11px;
    background: #1e293b;
    padding: 2px 8px;
    border-radius: 4px;
    color: #f59e0b;
    border: 1px solid #334155;
  }

  /* Digital Speed Display */
  .speed-display {
    background: #03070d;
    border: 2px solid #1e293b;
    border-radius: 14px;
    padding: 16px 20px;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
  }

  .speed-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #64748b;
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }

  .digits-wrap {
    display: grid;
    place-items: end start;
    font-family: 'DSEG7-Classic', monospace, sans-serif;
    font-size: 68px;
    line-height: 1;
  }
  .digits-wrap > * { grid-area: 1 / 1; }

  .digits-ghost {
    color: rgba(239, 68, 68, 0.08);
  }
  .digits-lit {
    color: #ef4444;
    text-shadow: 
      0 0 10px rgba(239, 68, 68, 0.8),
      0 0 25px rgba(239, 68, 68, 0.5);
    transition: color 0.3s;
  }
  .digits-lit.normal {
    color: #38bdf8;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
  }

  .speed-unit {
    position: absolute;
    right: 20px;
    bottom: 20px;
    font-size: 16px;
    font-weight: 700;
    color: #94a3b8;
  }

  /* Warning Status Banner */
  .status-banner {
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    color: #ef4444;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: flashAlert 0.8s infinite alternate;
  }

  @keyframes flashAlert {
    from { opacity: 0.7; }
    to { opacity: 1; background: rgba(239, 68, 68, 0.28); }
  }

  /* Hardware Buttons */
  .radar-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 18px;
  }

  .btn-tac {
    background: linear-gradient(180deg, #27354a 0%, #172233 100%);
    border: 1px solid #3b4e6b;
    border-radius: 8px;
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 12px 6px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.1s, background 0.15s;
  }
  .btn-tac:active {
    transform: translateY(2px);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .btn-tac.lock-active {
    background: #ef4444;
    color: #ffffff;
    border-color: #f87171;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
  }
</style>
</head>
<body>

<div class="radar-unit">
  <!-- Left Side: Radar Scope -->
  <div class="scope-box">
    <div class="scope-circle">
      <div class="scope-beam"></div>
      <div class="cross-h"></div>
      <div class="cross-v"></div>
      <div class="blip blip-1" title="Target A"></div>
      <div class="blip blip-2" title="Patrol Unit"></div>
    </div>
    <div class="scope-footer">
      <span>AZIMUTH: 042°</span>
      <span>RANGE: 850M</span>
    </div>
  </div>

  <!-- Right Side: Doppler Telemetry -->
  <div class="telemetry-box">
    <div>
      <div class="brand-bar">
        <h3>STALKER D-IV // KA-BAND</h3>
        <span class="band-tag">34.7 GHz</span>
      </div>

      <!-- Speed readout -->
      <div class="speed-display">
        <div class="speed-label-row">
          <span>TARGET SPEED</span>
          <span>LIMIT: 80</span>
        </div>
        <div class="digits-wrap">
          <span class="digits-ghost">888</span>
          <span class="digits-lit" id="speedValue">114</span>
        </div>
        <span class="speed-unit">KM/H</span>
      </div>

      <!-- Alert indicator -->
      <div class="status-banner" id="statusBanner">
        <span>⚠ VIOLATION: +34 KM/H</span>
        <span>LOCKED</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="radar-controls">
      <button class="btn-tac lock-active" id="lockBtn">LOCK</button>
      <button class="btn-tac" id="modeBtn">KA / LASER</button>
      <button class="btn-tac" id="simBtn">TRIGGER</button>
    </div>
  </div>
</div>

<script>
  const speedEl = document.getElementById("speedValue");
  const banner = document.getElementById("statusBanner");
  const lockBtn = document.getElementById("lockBtn");
  const simBtn = document.getElementById("simBtn");
  let locked = true;

  function updateSpeed(val) {
    speedEl.textContent = String(val).padStart(3, " ");
    if (val > 80) {
      speedEl.classList.remove("normal");
      banner.style.display = "flex";
      banner.innerHTML = `<span>⚠ VIOLATION: +${val - 80} KM/H</span><span>LOCKED</span>`;
    } else {
      speedEl.classList.add("normal");
      banner.style.display = "none";
    }
  }

  simBtn.addEventListener("click", () => {
    const speeds = [64, 78, 92, 114, 138, 55, 84];
    const pick = speeds[Math.floor(Math.random() * speeds.length)];
    updateSpeed(pick);
  });

  lockBtn.addEventListener("click", () => {
    locked = !locked;
    lockBtn.classList.toggle("lock-active", locked);
  });
</script>

</body>
</html>
