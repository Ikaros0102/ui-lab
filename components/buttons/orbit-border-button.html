<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Border Button</title>

<script type="application/json" data-uilab-meta>
{
  "title": "Orbit Border Button",
  "category": "buttons",
  "themes": ["mesh", "dark"],
  "tags": ["button", "border", "conic-gradient", "@property", "glow", "orbit"],
  "description": "Call-to-action button with rotating conic-gradient border powered by CSS @property and an outer glowing duplicate blur.",
  "techniques": ["@property --angle", "conic-gradient()", "blur() glow layer", "smooth hover transition", "color-mix()"],
  "recipe": "Ключевой приём — регистрация CSS свойства `@property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg }`. Это позволяет плавно анимировать угол градиента через стандартный `@keyframes`. Сзади лежит псевдоэлемент с `filter: blur(12px)`, который создаёт эффект динамического свечения ореола.",
  "preview": { "mode": "center" }
}
</script>

<style>
  @property --angle {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090d16;
    font-family: system-ui, -apple-system, sans-serif;
    gap: 20px;
    padding: 20px;
  }

  .button-group {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-orbit-wrap {
    position: relative;
    border-radius: 999px;
    padding: 2px;
  }

  /* Rotating border */
  .btn-orbit-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(
      from var(--angle),
      transparent 0%,
      #ff0077 15%,
      #7928ca 40%,
      #00dfd8 60%,
      transparent 75%
    );
    -webkit-mask: 
      linear-gradient(#fff 0 0) content-box, 
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotate-orbit 3.5s linear infinite;
  }

  /* Glow blur behind */
  .btn-orbit-wrap::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: inherit;
    background: conic-gradient(
      from var(--angle),
      transparent 0%,
      #ff0077 15%,
      #7928ca 40%,
      #00dfd8 60%,
      transparent 75%
    );
    filter: blur(14px);
    opacity: 0.6;
    z-index: -1;
    animation: rotate-orbit 3.5s linear infinite;
    transition: opacity 0.3s;
  }

  .btn-orbit-wrap:hover::after {
    opacity: 1;
    filter: blur(18px);
  }

  .btn-orbit {
    position: relative;
    z-index: 1;
    background: #0e1422;
    color: #f3f6fc;
    border: 0;
    padding: 14px 32px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.25s, transform 0.2s;
  }

  .btn-orbit:hover {
    background: #141d33;
    transform: scale(1.02);
  }

  .btn-orbit:active {
    transform: scale(0.98);
  }

  @keyframes rotate-orbit {
    to {
      --angle: 360deg;
    }
  }

  .btn-orbit-secondary::before,
  .btn-orbit-secondary::after {
    background: conic-gradient(
      from var(--angle),
      transparent 0%,
      #38ef7d 20%,
      #11998e 50%,
      #00b4db 70%,
      transparent 85%
    );
  }
</style>
</head>
<body>

<div class="button-group">
  <div class="btn-orbit-wrap">
    <button class="btn-orbit">
      <span>Get Started</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="btn-orbit-wrap btn-orbit-secondary">
    <button class="btn-orbit">
      <span>Explore Docs</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3v6z"/></svg>
    </button>
  </div>
</div>

</body>
</html>
