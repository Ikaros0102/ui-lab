<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #060911;
    color: #e2e8f0;
    font-family: ui-monospace, "Cascadia Code", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 860px;
    width: 100%;
  }

  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .tile {
    background: #0d1322;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 180px;
    position: relative;
    overflow: hidden;
  }

  .tile-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #64748b;
    text-transform: uppercase;
  }

  /* 1. Radar Sweep */
  .radar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1px solid #0284c7;
    position: relative;
    background: radial-gradient(circle, rgba(2, 132, 199, 0.1) 40%, transparent 41%);
    background-size: 20px 20px;
  }
  .radar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 70%, rgba(56, 189, 248, 0.7) 100%);
    animation: rotate 2s linear infinite;
  }

  /* 2. Oscilloscope Wave */
  .wave-svg {
    width: 80px;
    height: 40px;
  }
  .wave-path {
    fill: none;
    stroke: #10b981;
    stroke-width: 2.5;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: wave-dash 2s linear infinite;
  }

  /* 3. Segmented LCD Bar */
  .lcd-bars {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 36px;
  }
  .bar {
    width: 6px;
    height: 100%;
    background: #f59e0b;
    border-radius: 2px;
    animation: jump 1.2s ease-in-out infinite alternate;
  }
  .bar:nth-child(1) { animation-delay: 0.1s; }
  .bar:nth-child(2) { animation-delay: 0.25s; }
  .bar:nth-child(3) { animation-delay: 0.4s; }
  .bar:nth-child(4) { animation-delay: 0.55s; }
  .bar:nth-child(5) { animation-delay: 0.7s; }

  /* 4. Conic Ring */
  .conic-ring {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, transparent, #ec4899);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotate 1s linear infinite;
  }

  /* 5. Pulsing Core */
  .pulsing-core {
    width: 24px;
    height: 24px;
    background: #8b5cf6;
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 16px #8b5cf6;
  }
  .pulsing-core::before, .pulsing-core::after {
    content: "";
    position: absolute;
    inset: -12px;
    border: 1px solid #8b5cf6;
    border-radius: 50%;
    animation: ripple 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
  }
  .pulsing-core::after {
    animation-delay: 0.9s;
  }

  /* 6. Orbiting Dots */
  .orbit-wrap {
    width: 48px;
    height: 48px;
    position: relative;
    animation: rotate 2.5s cubic-bezier(0.77, 0, 0.175, 1) infinite;
  }
  .orbit-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #06b6d4;
    box-shadow: 0 0 8px #06b6d4;
  }
  .orbit-dot:nth-child(1) { top: 0; left: 20px; }
  .orbit-dot:nth-child(2) { bottom: 0; left: 20px; }
  .orbit-dot:nth-child(3) { top: 20px; left: 0; }
  .orbit-dot:nth-child(4) { top: 20px; right: 0; }

  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes wave-dash { to { stroke-dashoffset: 0; } }
  @keyframes jump { 0% { height: 20%; } 100% { height: 100%; } }
  @keyframes ripple {
    0% { transform: scale(0.6); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
</style>
</head>
<body>

<div class="grid">
  <div class="tile">
    <div class="radar"></div>
    <span class="tile-label">01. Radar Sweep</span>
  </div>

  <div class="tile">
    <svg class="wave-svg" viewBox="0 0 100 50">
      <path class="wave-path" d="M 0 25 Q 12 5, 25 25 T 50 25 T 75 25 T 100 25" />
    </svg>
    <span class="tile-label">02. Oscilloscope</span>
  </div>

  <div class="tile">
    <div class="lcd-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <span class="tile-label">03. Telemetry LCD</span>
  </div>

  <div class="tile">
    <div class="conic-ring"></div>
    <span class="tile-label">04. Conic Mask</span>
  </div>

  <div class="tile">
    <div class="pulsing-core"></div>
    <span class="tile-label">05. Pulse Core</span>
  </div>

  <div class="tile">
    <div class="orbit-wrap">
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
    </div>
    <span class="tile-label">06. Orbit Ring</span>
  </div>
</div>

</body>
</html>
