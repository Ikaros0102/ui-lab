<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Island HUD</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #1e2640 0%, #080c14 70%);
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px;
    overflow: hidden;
  }

  /* Island Wrapper */
  .island-stage {
    position: relative;
    display: flex;
    justify-content: center;
    margin-bottom: 50px;
  }

  .island {
    position: relative;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    color: #ffffff;
    box-shadow: 
      0 20px 45px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(255, 255, 255, 0.08),
      inset 0 1px 1px rgba(255, 255, 255, 0.2);
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    transition: 
      width 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.2),
      height 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.2),
      border-radius 0.45s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }

  /* States */
  .island[data-state="compact"] {
    width: 210px;
    height: 38px;
    border-radius: 999px;
  }

  .island[data-state="weather"] {
    width: 320px;
    height: 84px;
    border-radius: 36px;
    padding: 16px 20px;
  }

  .island[data-state="music"] {
    width: 350px;
    height: 140px;
    border-radius: 42px;
    padding: 20px;
    flex-direction: column;
    justify-content: space-between;
  }

  .island[data-state="call"] {
    width: 300px;
    height: 72px;
    border-radius: 34px;
    padding: 14px 18px;
  }

  /* Content views */
  .view {
    display: none;
    width: 100%;
    align-items: center;
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .island[data-state="compact"] .view-compact { display: flex; justify-content: space-between; }
  .island[data-state="weather"] .view-weather { display: flex; justify-content: space-between; }
  .island[data-state="music"] .view-music { display: flex; flex-direction: column; gap: 12px; }
  .island[data-state="call"] .view-call { display: flex; justify-content: space-between; }

  /* Compact View Elements */
  .view-compact .dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 8px #22c55e;
  }
  .view-compact .label {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .wave-icon {
    display: flex;
    gap: 2px;
    align-items: center;
    height: 12px;
  }
  .wave-bar {
    width: 2px;
    height: 100%;
    background: #38bdf8;
    border-radius: 2px;
    animation: wave 1s infinite ease-in-out alternate;
  }
  .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 60%; }
  .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 80%; }
  @keyframes wave { to { height: 20%; } }

  /* Weather View Elements */
  .weather-left { display: flex; align-items: center; gap: 12px; }
  .weather-icon {
    font-size: 28px;
  }
  .weather-info h4 { margin: 0; font-size: 15px; font-weight: 600; }
  .weather-info p { margin: 2px 0 0; font-size: 12px; color: #94a3b8; }
  .weather-temp { font-size: 24px; font-weight: 700; color: #38bdf8; }

  /* Music View Elements */
  .music-top { display: flex; align-items: center; gap: 14px; width: 100%; }
  .album-art {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    display: grid;
    place-items: center;
    font-size: 20px;
  }
  .track-details { flex: 1; }
  .track-title { font-size: 14px; font-weight: 600; margin: 0; }
  .track-artist { font-size: 12px; color: #94a3b8; margin: 2px 0 0; }
  .music-progress {
    width: 100%;
    height: 4px;
    background: #27272a;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .music-fill {
    width: 58%;
    height: 100%;
    background: #38bdf8;
    border-radius: inherit;
  }
  .music-controls {
    display: flex;
    justify-content: center;
    gap: 24px;
    width: 100%;
    color: #e2e8f0;
  }

  /* Call View Elements */
  .call-info { display: flex; align-items: center; gap: 12px; }
  .call-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3b82f6;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
  }
  .call-text h4 { margin: 0; font-size: 13.5px; }
  .call-text p { margin: 2px 0 0; font-size: 11.5px; color: #22c55e; }
  .call-actions { display: flex; gap: 8px; }
  .btn-call {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .btn-call.decline { background: #ef4444; color: white; }
  .btn-call.accept { background: #22c55e; color: white; }

  /* State Switcher Bar */
  .state-switcher {
    display: flex;
    gap: 8px;
    background: rgba(255, 255, 255, 0.06);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .state-btn {
    background: transparent;
    border: 0;
    color: #94a3b8;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .state-btn:hover { color: #f8fafc; }
  .state-btn.active {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
  }
</style>
</head>
<body>

<div class="island-stage">
  <div class="island" id="island" data-state="compact">
    <!-- Compact View -->
    <div class="view view-compact">
      <div class="label">
        <span class="dot"></span>
        <span>Online</span>
      </div>
      <div class="wave-icon">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>

    <!-- Weather View -->
    <div class="view view-weather">
      <div class="weather-left">
        <span class="weather-icon">🌧️</span>
        <div class="weather-info">
          <h4>San Francisco</h4>
          <p>Light Rain · Precip 80%</p>
        </div>
      </div>
      <div class="weather-temp">16°</div>
    </div>

    <!-- Music View -->
    <div class="view view-music">
      <div class="music-top">
        <div class="album-art">🎵</div>
        <div class="track-details">
          <p class="track-title">Midnight City</p>
          <p class="track-artist">M83 — Hurry Up, We're Dreaming</p>
        </div>
      </div>
      <div class="music-progress">
        <div class="music-fill"></div>
      </div>
      <div class="music-controls">
        <span>⏮</span>
        <span>⏸</span>
        <span>⏭</span>
      </div>
    </div>

    <!-- Call View -->
    <div class="view view-call">
      <div class="call-info">
        <div class="call-avatar">JD</div>
        <div class="call-text">
          <h4>John Doe</h4>
          <p>00:42 · Connected</p>
        </div>
      </div>
      <div class="call-actions">
        <button class="btn-call decline">✕</button>
        <button class="btn-call accept">✓</button>
      </div>
    </div>
  </div>
</div>

<!-- Switcher Buttons -->
<div class="state-switcher" id="switcher">
  <button class="state-btn active" data-target="compact">Compact</button>
  <button class="state-btn" data-target="weather">Weather</button>
  <button class="state-btn" data-target="music">Player</button>
  <button class="state-btn" data-target="call">Call</button>
</div>

<script>
  const island = document.getElementById("island");
  const switcher = document.getElementById("switcher");
  const buttons = switcher.querySelectorAll(".state-btn");

  function setState(state) {
    island.dataset.state = state;
    buttons.forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.target === state);
    });
  }

  buttons.forEach((btn) => {
    btn.addEventListener("click", () => setState(btn.dataset.target));
  });

  island.addEventListener("click", () => {
    const order = ["compact", "weather", "music", "call"];
    const next = order[(order.indexOf(island.dataset.state) + 1) % order.length];
    setState(next);
  });
</script>

</body>
</html>
