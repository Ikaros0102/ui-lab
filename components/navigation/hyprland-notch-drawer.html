<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --shell-bg: #fcf3f0;
    --card-blush: #f5e3de;
    --card-blush-hover: #f0d8d1;
    --ink-espresso: #422c29;
    --ink-muted: #876b66;
    --accent-maroon: #783c36;
    --accent-olive: #7d6b47;
    --border-soft: rgba(120, 60, 54, 0.12);
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--shell-bg);
    color: var(--ink-espresso);
    font-family: 'Plus Jakarta Sans', sans-serif;
    user-select: none;
    display: flex;
    padding: 7px 7px 7px 38px;
    position: relative;
  }

  /* =========================================================
     INNER WALLPAPER CANVAS (WARM PARCHMENT & SOFT INK WASH)
     ========================================================= */
  .desktop-viewport {
    flex: 1;
    height: 100%;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    border: 1.5px solid rgba(90, 65, 58, 0.25);
    /* Мягкий бумажно-кремовый фон с акварельными тушевыми акцентами внизу */
    background-color: #efe8d8;
    background-image:
      radial-gradient(ellipse at 48% 88%, rgba(35, 34, 32, 0.16) 0%, rgba(35, 34, 32, 0.05) 32%, transparent 60%),
      radial-gradient(circle at 38% 75%, rgba(45, 42, 38, 0.10) 0%, transparent 40%),
      radial-gradient(circle at 58% 65%, rgba(120, 95, 85, 0.08) 0%, transparent 45%),
      linear-gradient(180deg, #f5efe2 0%, #ede4d3 65%, #e5dbc8 100%);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.05);
  }

  /* =========================================================
     LEFT VERTICAL SHELL BAR
     ========================================================= */
  .left-shell-bar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 38px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    color: var(--ink-espresso);
  }

  .bar-top-group, .bar-bottom-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .arch-logo {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink-espresso);
    cursor: pointer;
    margin-bottom: 4px;
  }

  /* Left Workspace Pill */
  .ws-vertical-pill {
    background: var(--card-blush);
    border-radius: 16px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    width: 26px;
  }

  .ws-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #c9ada6;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .ws-active-pacman {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-maroon);
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(120, 60, 54, 0.35);
  }

  .ws-mini-ico {
    font-size: 10px;
    color: var(--ink-espresso);
    cursor: pointer;
  }

  /* Center Vertical "Desktop" Label */
  .vertical-desktop-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-espresso);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.85;
  }

  .tray-icons-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--ink-muted);
  }

  .tray-time-stack {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.05;
    text-align: center;
    color: var(--ink-espresso);
    margin: 2px 0;
  }

  .sys-bottom-pill {
    background: var(--card-blush);
    border-radius: 14px;
    padding: 7px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    width: 24px;
    font-size: 10px;
    color: var(--ink-espresso);
  }

  /* =========================================================
     TOP-CENTER CONNECTED DASHBOARD DRAWER (WITH FILLET CORNERS)
     ========================================================= */
  .top-drawer-container {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 646px;
    background: var(--shell-bg);
    border-radius: 0 0 26px 26px;
    padding: 8px 18px 18px;
    z-index: 20;
    box-shadow:
      0 18px 40px rgba(45, 30, 28, 0.14),
      0 1px 0 rgba(90, 65, 58, 0.25);
  }

  /* Вогнутые уголки (Inverted Concave Fillets), соединяющие панель с верхней рамкой */
  .top-drawer-container::before,
  .top-drawer-container::after {
    content: "";
    position: absolute;
    top: 0;
    width: 22px;
    height: 22px;
    background: transparent;
    pointer-events: none;
  }

  .top-drawer-container::before {
    left: -22px;
    border-top-right-radius: 20px;
    box-shadow: 10px -10px 0 10px var(--shell-bg);
  }

  .top-drawer-container::after {
    right: -22px;
    border-top-left-radius: 20px;
    box-shadow: -10px -10px 0 10px var(--shell-bg);
  }

  /* Top Navigation Tabs Inside Drawer */
  .drawer-tabs-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1.5px solid #e6d4ce;
    margin-bottom: 14px;
  }

  .drawer-tab {
    background: transparent;
    border: none;
    padding: 6px 0 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: color 0.2s ease;
  }

  .drawer-tab:hover {
    color: var(--ink-espresso);
  }

  .drawer-tab.active {
    color: var(--ink-espresso);
    font-weight: 700;
  }

  .drawer-tab.active::after {
    content: "";
    position: absolute;
    bottom: -1.5px;
    width: 72px;
    height: 2.5px;
    background: var(--accent-maroon);
    border-radius: 2px;
  }

  .tab-ico {
    font-size: 13px;
  }

  /* =========================================================
     MAIN BENTO GRID INSIDE DRAWER
     ========================================================= */
  .drawer-bento-grid {
    display: grid;
    grid-template-columns: 1fr 164px;
    gap: 12px;
  }

  .bento-left-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Top Row: Weather Card + Arch/Hyprland User Card */
  .bento-top-row {
    display: grid;
    grid-template-columns: 178px 1fr;
    gap: 12px;
    height: 98px;
  }

  .blush-card {
    background: var(--card-blush);
    border-radius: 18px;
    padding: 14px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .blush-card.highlight-pulse {
    box-shadow: 0 0 0 2px var(--accent-maroon);
  }

  /* 1. Weather Card */
  .weather-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .sun-svg {
    width: 48px;
    height: 48px;
    color: var(--ink-espresso);
    animation: slowSpin 28s linear infinite;
  }

  @keyframes slowSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .weather-info h3 {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.05;
    color: var(--ink-espresso);
  }

  .weather-info span {
    font-size: 11.5px;
    color: var(--ink-muted);
    display: block;
    text-align: center;
    margin-top: 2px;
  }

  /* 2. System Fetch Card (Arch Linux / Hyprland) */
  .sysfetch-box {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
  }

  .sys-avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #ffd6e0 0%, #5b4d6e 55%, #241e30 100%);
    border: 2px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    overflow: hidden;
  }

  .sys-lines {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-espresso);
  }

  .sys-line {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sys-line i {
    font-style: normal;
    color: var(--ink-muted);
    width: 14px;
    text-align: center;
  }

  /* Bottom Row: [Vertical Clock] + [Monthly Calendar] + [3 Vertical Sliders] */
  .bento-bottom-row {
    display: grid;
    grid-template-columns: 74px 1fr 84px;
    gap: 12px;
    height: 204px;
  }

  /* 3. Vertical Clock Pill */
  .v-clock-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px 6px;
  }

  .v-clock-num {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.05;
    color: var(--ink-espresso);
  }

  .v-clock-dots {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-muted);
    margin: 4px 0;
  }

  .v-clock-date {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 10px;
  }

  /* 4. Monthly Calendar Card */
  .cal-card {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .cal-head, .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
  }

  .cal-head span {
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-espresso);
    padding-bottom: 4px;
  }

  .cal-grid {
    flex: 1;
    align-items: center;
  }

  .c-day {
    width: 22px;
    height: 22px;
    margin: 0 auto;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-espresso);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .c-day:hover {
    background: rgba(120, 60, 54, 0.12);
  }

  .c-day.out {
    color: #bca39d;
    font-weight: 500;
  }

  .c-day.active {
    background: var(--accent-maroon);
    color: #ffffff;
    font-weight: 700;
  }

  /* 5. Three Vertical Resource Sliders Card */
  .sliders-card {
    padding: 12px 10px;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
  }

  .v-slider-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    flex: 1;
  }

  .v-slider-track {
    flex: 1;
    width: 8px;
    background: #fcf3f0;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    cursor: ns-resize;
    display: flex;
    align-items: flex-end;
  }

  .v-slider-fill {
    width: 100%;
    border-radius: 6px;
    transition: height 0.15s ease;
  }

  .v-slider-ico {
    font-size: 11px;
    color: var(--ink-muted);
  }

  /* 6. Right Tall Column: Media Player + Bongo Cat */
  .media-tall-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 12px 10px;
    text-align: center;
  }

  .vinyl-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Left side vertical progress pill next to album art */
  .vinyl-side-pill {
    position: absolute;
    left: -12px;
    width: 5px;
    height: 14px;
    border-radius: 3px;
    background: var(--accent-maroon);
  }

  .album-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, #ff2a85 0%, #591885 45%, #121638 85%);
    border: 2px solid #fff;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    transition: transform 0.3s ease;
  }

  .album-circle.spinning {
    animation: slowSpin 8s linear infinite;
  }

  .song-meta {
    width: 100%;
    margin-top: 6px;
  }

  .song-meta h4 {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-espresso);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-meta p {
    font-size: 9.5px;
    color: var(--ink-muted);
    margin-top: 2px;
    line-height: 1.3;
  }

  .media-btns-row {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13px;
    color: var(--ink-espresso);
    margin: 4px 0;
  }

  .media-btns-row button {
    background: none;
    border: none;
    color: inherit;
    font-size: inherit;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .media-btns-row button:hover { transform: scale(1.2); }

  /* Bongo Cat SVG Container */
  .bongo-cat-box {
    width: 110px;
    height: 58px;
    cursor: pointer;
  }

  .bongo-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  @media (max-width: 820px) {
    .top-drawer-container { width: 95%; position: static; transform: none; margin: 0 auto; }
    .drawer-bento-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- =========================================================
     LEFT VERTICAL SHELL BAR
     ========================================================= -->
<aside class="left-shell-bar">
  <div class="bar-top-group">
    <div class="arch-logo" title="Arch Linux"></div>

    <div class="ws-vertical-pill" id="wsPill">
      <div class="ws-dot"></div>
      <div class="ws-mini-ico">🌐</div>
      <div class="ws-active-pacman">ᗧ</div>
      <div class="ws-mini-ico">&gt;_</div>
      <div class="ws-dot"></div>
      <div class="ws-dot"></div>
    </div>
  </div>

  <div class="vertical-desktop-label">
    <span>🗔</span> <span>Desktop</span>
  </div>

  <div class="bar-bottom-group">
    <div class="tray-icons-col">
      <span>ᛒ</span>
      <span>👁</span>
      <span>💬</span>
      <span></span>
      <span style="color:#22c55e;">●</span>
      <span>📅</span>
    </div>

    <div class="tray-time-stack">
      <div>21</div>
      <div>40</div>
    </div>

    <div class="sys-bottom-pill">
      <span>🛜</span>
      <span>ᛒ</span>
      <span>🚀</span>
      <span style="color:var(--accent-maroon);">⏻</span>
    </div>
  </div>
</aside>

<!-- =========================================================
     MAIN INNER DESKTOP VIEWPORT & TOP DRAWER
     ========================================================= -->
<main class="desktop-viewport">

  <!-- Connected Top-Center Notch Drawer -->
  <section class="top-drawer-container">

    <!-- 1. Top Navigation Tabs -->
    <nav class="drawer-tabs-bar" id="drawerTabs">
      <button class="drawer-tab active" data-tab="dashboard">
        <span class="tab-ico">⊞</span>
        <span>Dashboard</span>
      </button>
      <button class="drawer-tab" data-tab="media">
        <span class="tab-ico">🎵</span>
        <span>Media</span>
      </button>
      <button class="drawer-tab" data-tab="performance">
        <span class="tab-ico">⏲</span>
        <span>Performance</span>
      </button>
      <button class="drawer-tab" data-tab="workspaces">
        <span class="tab-ico">🫧</span>
        <span>Workspaces</span>
      </button>
    </nav>

    <!-- 2. Main Bento Grid -->
    <div class="drawer-bento-grid">

      <div class="bento-left-area">

        <!-- Top Row: Weather + System Fetch -->
        <div class="bento-top-row">

          <!-- Weather Card -->
          <div class="blush-card weather-box" data-group="dashboard">
            <svg class="sun-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
              <circle cx="24" cy="24" r="10"/>
              <line x1="24" y1="4" x2="24" y2="9"/>
              <line x1="24" y1="39" x2="24" y2="44"/>
              <line x1="4" y1="24" x2="9" y2="24"/>
              <line x1="39" y1="24" x2="44" y2="24"/>
              <line x1="9.8" y1="9.8" x2="13.4" y2="13.4"/>
              <line x1="34.6" y1="34.6" x2="38.2" y2="38.2"/>
              <line x1="38.2" y1="9.8" x2="34.6" y2="13.4"/>
              <line x1="13.4" y1="34.6" x2="9.8" y2="38.2"/>
            </svg>
            <div class="weather-info">
              <h3>15°C</h3>
              <span>Clear</span>
            </div>
          </div>

          <!-- Arch / Hyprland System Card -->
          <div class="blush-card sysfetch-box" data-group="workspaces">
            <div class="sys-avatar">🖤</div>
            <div class="sys-lines">
              <div class="sys-line"><i>👤</i> <span>: Arch Linux</span></div>
              <div class="sys-line"><i>🗔</i> <span>: Hyprland</span></div>
              <div class="sys-line"><i>🕒</i> <span id="uptimeReadout">: up 1 hour, 23 minutes</span></div>
            </div>
          </div>

        </div>

        <!-- Bottom Row: Vertical Clock + Calendar + 3 Vertical Resource Sliders -->
        <div class="bento-bottom-row">

          <!-- Vertical Clock -->
          <div class="blush-card v-clock-card" data-group="dashboard">
            <div class="v-clock-num">21</div>
            <div class="v-clock-dots">•••</div>
            <div class="v-clock-num">06</div>
            <div class="v-clock-date">Sat, 7</div>
          </div>

          <!-- Monthly Calendar -->
          <div class="blush-card cal-card" data-group="dashboard">
            <div class="cal-head">
              <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="cal-grid" id="calendarGrid"></div>
          </div>

          <!-- 3 Vertical Resource Sliders (Draggable) -->
          <div class="blush-card sliders-card" data-group="performance">
            <div class="v-slider-col">
              <div class="v-slider-track" data-slider="cpu">
                <div class="v-slider-fill" style="height: 8%; background: #783c36;"></div>
              </div>
              <span class="v-slider-ico" title="CPU Load">⚙️</span>
            </div>

            <div class="v-slider-col">
              <div class="v-slider-track" data-slider="ram">
                <div class="v-slider-fill" style="height: 28%; background: #6b4c3b;"></div>
              </div>
              <span class="v-slider-ico" title="Memory Usage">🖧</span>
            </div>

            <div class="v-slider-col">
              <div class="v-slider-track" data-slider="disk">
                <div class="v-slider-fill" style="height: 44%; background: #7d6b47;"></div>
              </div>
              <span class="v-slider-ico" title="Disk / Battery">🔋</span>
            </div>
          </div>

        </div>

      </div>

      <!-- Right Tall Card: Media Player + Animated Bongo Cat -->
      <div class="blush-card media-tall-card" data-group="media">
        <div class="vinyl-wrap">
          <div class="vinyl-side-pill"></div>
          <div class="album-circle spinning" id="albumArtCircle">
            THE<br>GAME
          </div>
        </div>

        <div class="song-meta">
          <h4 id="songTitle">Bad Apple!! feat. no...</h4>
          <p id="songAlbum">THE GAME<br>Alstroemeria Records</p>
        </div>

        <div class="media-btns-row">
          <button id="prevBtn" title="Previous">⏮</button>
          <button id="playBtn" title="Play / Pause">▷</button>
          <button id="nextBtn" title="Next">⏭</button>
        </div>

        <!-- Line-Art Bongo Cat (Taps Paws on Beat / Click!) -->
        <div class="bongo-cat-box" id="bongoCatBox" title="Click Bongo Cat!">
          <svg class="bongo-svg" viewBox="0 0 120 65" fill="none">
            <!-- Desk Edge Line -->
            <path d="M 6 56 L 114 44" stroke="#422c29" stroke-width="2" stroke-linecap="round"/>
            <!-- Cat Body Dome -->
            <path d="M 22 53 C 20 32, 32 22, 36 14 L 46 22 C 58 20, 72 20, 82 22 L 92 12 C 98 20, 102 34, 100 45"
                  fill="#ffffff" stroke="#422c29" stroke-width="2" stroke-linejoin="round"/>
            <!-- Eyes & Tiny Mouth -->
            <circle cx="52" cy="33" r="1.8" fill="#422c29"/>
            <circle cx="76" cy="31" r="1.8" fill="#422c29"/>
            <path d="M 61 34 Q 64 37 67 34" stroke="#422c29" stroke-width="1.6" stroke-linecap="round"/>
            <!-- Left Paw -->
            <path id="pawLeft" d="M 24 46 C 14 48, 14 55, 24 54" fill="#ffffff" stroke="#422c29" stroke-width="2" stroke-linecap="round"/>
            <!-- Right Paw -->
            <path id="pawRight" d="M 88 40 C 82 45, 88 50, 95 45" fill="#ffffff" stroke="#422c29" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

    </div>

  </section>

</main>

<script>
(() => {
  // =========================================================================
  // 1. POPULATE CALENDAR GRID (EXACT DATES FROM SCREENSHOT)
  // =========================================================================
  const calGrid = document.getElementById('calendarGrid');
  const dates = [
    { d: 26, out: true }, { d: 27, out: true }, { d: 28, out: true }, { d: 29, out: true }, { d: 30, out: true }, { d: 31, out: true }, { d: 1 },
    { d: 2 }, { d: 3 }, { d: 4 }, { d: 5 }, { d: 6 }, { d: 7, active: true }, { d: 8 },
    { d: 9 }, { d: 10 }, { d: 11 }, { d: 12 }, { d: 13 }, { d: 14 }, { d: 15 },
    { d: 16 }, { d: 17 }, { d: 18 }, { d: 19 }, { d: 20 }, { d: 21 }, { d: 22 },
    { d: 23 }, { d: 24 }, { d: 25 }, { d: 26 }, { d: 27 }, { d: 28 }, { d: 29 },
    { d: 30 }, { d: 1, out: true }, { d: 2, out: true }, { d: 3, out: true }, { d: 4, out: true }, { d: 5, out: true }, { d: 6, out: true }
  ];

  calGrid.innerHTML = dates.map(item =>
    `<div class="c-day ${item.out ? 'out' : ''} ${item.active ? 'active' : ''}">${item.d}</div>`
  ).join('');

  calGrid.querySelectorAll('.c-day').forEach(day => {
    day.addEventListener('click', () => {
      calGrid.querySelectorAll('.c-day').forEach(x => x.classList.remove('active'));
      day.classList.add('active');
    });
  });

  // =========================================================================
  // 2. TOP TABS INTERACTION
  // =========================================================================
  const tabs = document.querySelectorAll('#drawerTabs .drawer-tab');
  const cards = document.querySelectorAll('.blush-card');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;

      cards.forEach(c => {
        c.classList.remove('highlight-pulse');
        if (target !== 'dashboard' && c.dataset.group === target) {
          c.classList.add('highlight-pulse');
        }
      });
    });
  });

  // =========================================================================
  // 3. DRAGGABLE VERTICAL RESOURCE SLIDERS
  // =========================================================================
  document.querySelectorAll('.v-slider-track').forEach(track => {
    const fill = track.querySelector('.v-slider-fill');
    let dragging = false;

    const updateHeight = (clientY) => {
      const rect = track.getBoundingClientRect();
      const relY = Math.max(0, Math.min(rect.height, rect.bottom - clientY));
      const pct = Math.round((relY / rect.height) * 100);
      fill.style.height = `${ Math.max(6, pct) }%`;
    };

    track.addEventListener('pointerdown', e => {
      dragging = true;
      updateHeight(e.clientY);
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', e => { if (dragging) updateHeight(e.clientY); });
    track.addEventListener('pointerup', () => { dragging = false; });
  });

  // =========================================================================
  // 4. MEDIA PLAYER & BONGO CAT PAW TAPPING ANIMATION
  // =========================================================================
  const SONGS = [
    { title: 'Bad Apple!! feat. no...', album: 'THE GAME<br>Alstroemeria Records', label: 'THE<br>GAME' },
    { title: 'Night of Nights',         album: ' COOL&CREATE<br>Beatmario',        label: 'COOL<br>BEAT' },
    { title: 'U.N. Owen Was Her?',      album: 'Touhou EoSD<br>ZUN',               label: 'EOSD<br>ZUN' }
  ];

  let songIdx = 0;
  let playing = true;
  const playBtn = document.getElementById('playBtn');
  const albumCircle = document.getElementById('albumArtCircle');
  const pawLeft = document.getElementById('pawLeft');
  const pawRight = document.getElementById('pawRight');

  function updateSongUI() {
    const s = SONGS[songIdx];
    document.getElementById('songTitle').textContent = s.title;
    document.getElementById('songAlbum').innerHTML = s.album;
    albumCircle.innerHTML = s.label;
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '❚❚' : '▷';
    albumCircle.classList.toggle('spinning', playing);
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    songIdx = (songIdx - 1 + SONGS.length) % SONGS.length;
    updateSongUI();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    songIdx = (songIdx + 1) % SONGS.length;
    updateSongUI();
  });

  // Animate Bongo Cat paws tapping on the desk line!
  let beatStep = 0;
  function tapBongoPaws() {
    beatStep++;
    const leftDown = beatStep % 2 === 0;
    pawLeft.setAttribute('transform', leftDown ? 'translate(0, 3)' : 'translate(0, -2)');
    pawRight.setAttribute('transform', !leftDown ? 'translate(0, 3)' : 'translate(0, -2)');
  }

  setInterval(() => {
    if (playing) tapBongoPaws();
  }, 320);

  document.getElementById('bongoCatBox').addEventListener('click', tapBongoPaws);
})();
</script>
</body>
</html>
