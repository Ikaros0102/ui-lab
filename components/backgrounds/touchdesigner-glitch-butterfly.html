<style>

<script>
(() => {
  const canvas = document.getElementById('glitchCanvas');
  const ctx = canvas.getContext('2d');

  // Offscreen buffer for rendering the clean glowing butterfly before applying slit-scan glitch slices
  const bufferCanvas = document.createElement('canvas');
  const bCtx = bufferCanvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    bufferCanvas.width = W * dpr;
    bufferCanvas.height = H * dpr;
  }
  window.addEventListener('resize', resize);
  resize();

  // =========================================================================
  // 1. COLOR PALETTES (EXACT MATCH TO VIDEO 00:00 CYAN & 00:03 MAGENTA)
  // =========================================================================
  const PALETTES = {
    cyan: {
      name: 'COBALT_CYAN',
      tagColor: '#38bdf8',
      wingDeep: 'rgba(28, 64, 255, 0.85)',
      wingMid: 'rgba(0, 215, 255, 0.92)',
      wingEdge: 'rgba(165, 255, 245, 0.98)',
      coreBloom: 'rgba(195, 250, 255, 0.95)',
      outerAura: 'rgba(0, 195, 255, 0.36)',
      sparkA: '#00f0ff',
      sparkB: '#6366f1',
      sparkC: '#ffffff'
    },
    magenta: {
      name: 'MAGENTA_GOLD',
      tagColor: '#f472b6',
      wingDeep: 'rgba(180, 18, 125, 0.85)',
      wingMid: 'rgba(255, 55, 195, 0.92)',
      wingEdge: 'rgba(255, 225, 155, 0.98)',
      coreBloom: 'rgba(255, 240, 210, 0.95)',
      outerAura: 'rgba(244, 63, 160, 0.36)',
      sparkA: '#ff2a85',
      sparkB: '#fde047',
      sparkC: '#ffffff'
    }
  };

  let colorMode = 'auto'; // 'auto' | 'cyan' | 'magenta'
  let activePaletteKey = 'cyan';
  let showCvHud = true;
  let glitchIntensity = 0.68;
  let burstTimer = 0;

  // =========================================================================
  // 2. BACKGROUND STAR DUST & QUANTUM WING PARTICLES
  // =========================================================================
  const bgStars = Array.from({ length: 110 }, () => ({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 1.6 + 0.4,
    alpha: Math.random() * 0.45 + 0.1,
    twinkleSpeed: Math.random() * 0.04 + 0.01,
    phase: Math.random() * Math.PI * 2
  }));

  const sparks = [];
  function spawnWingSparks(cx, cy, pal, count = 4) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.random() - 0.5) * Math.PI * 1.6;
      const dist = Math.random() * 130 + 10;
      const isGhostTrail = Math.random() < 0.35;
      sparks.push({
        x: cx + Math.cos(angle) * dist * 0.7,
        y: cy + Math.sin(angle) * dist,
        vx: (Math.random() - 0.25) * (isGhostTrail ? 4.5 : 2.2), // Drift right like video!
        vy: (Math.random() - 0.6) * 2.2,
        size: Math.random() < 0.3 ? Math.random() * 5 + 2.5 : Math.random() * 2.2 + 0.8,
        isSquare: Math.random() < 0.45,
        color: Math.random() < 0.5 ? pal.sparkA : Math.random() < 0.8 ? pal.sparkB : pal.sparkC,
        life: 1.0,
        decay: Math.random() * 0.022 + 0.012
      });
    }
  }

  // =========================================================================
  // 3. DRAW BIOLUMINESCENT 3D BUTTERFLY ON OFFSCREEN BUFFER
  // =========================================================================
  // Returns key 2D screen-space vertices so the CV Blob Tracker HUD can lock onto them!
  function drawButterflyToBuffer(t, pal, isGlitchFrame) {
    bCtx.save();
    bCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
    bCtx.scale(dpr, dpr);

    const cx = W * 0.48 + Math.sin(t * 1.7) * 8;
    const cy = H * 0.49 + Math.cos(t * 2.3) * 10;

    // 3/4 Perspective Wing Flap Kinematics:
    // Left (foreground) wing sweeps wide; Right (background) wing is foreshortened & angled
    const flapPhase = Math.sin(t * 5.8);
    const flapNorm = (flapPhase + 1) * 0.5; // 0 (closed) to 1 (open)

    // Occasional micro-stutter in wing angle during heavy glitch frames (just like video!)
    const stutter = isGlitchFrame ? (Math.random() - 0.5) * 0.35 : 0;
    const leftWingSpan = (0.28 + flapNorm * 0.78 + stutter);
    const rightWingSpan = (0.22 + (1 - flapNorm * 0.55) * 0.65 - stutter * 0.5);

    bCtx.globalCompositeOperation = 'lighter';

    // 1. Deep Volumetric Core Aura Behind Thorax
    const auraGrad = bCtx.createRadialGradient(cx - 12, cy + 18, 4, cx - 12, cy + 18, 175);
    auraGrad.addColorStop(0, pal.coreBloom);
    auraGrad.addColorStop(0.25, pal.outerAura);
    auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
    bCtx.fillStyle = auraGrad;
    bCtx.beginPath();
    bCtx.arc(cx - 12, cy + 18, 175, 0, Math.PI * 2);
    bCtx.fill();

    // Helper to draw a single organic translucent wing with glowing edges & internal veins
    function renderWing(sideScaleX, rotDeg, isUpper, isGhostCopy = false, ghostOffset = 0) {
      bCtx.save();
      bCtx.translate(cx + ghostOffset, cy - ghostOffset * 0.35);
      bCtx.rotate((rotDeg * Math.PI) / 180);
      bCtx.scale(sideScaleX, 1);

      const alphaMul = isGhostCopy ? 0.32 : 1.0;

      if (isUpper) {
        // UPPER FORE-WING GEOMETRY (Tall, sweeping apex like a Morpho / Swallowtail)
        const wGrad = bCtx.createRadialGradient(-15, -25, 8, -45, -95, 195);
        wGrad.addColorStop(0, '#ffffff');
        wGrad.addColorStop(0.22, pal.wingEdge);
        wGrad.addColorStop(0.55, pal.wingMid);
        wGrad.addColorStop(0.88, pal.wingDeep);
        wGrad.addColorStop(1, 'rgba(0,0,0,0)');

        bCtx.globalAlpha = 0.88 * alphaMul;
        bCtx.fillStyle = wGrad;
        bCtx.beginPath();
        bCtx.moveTo(0, 10);
        bCtx.bezierCurveTo(-18, -65, -35, -165, -22, -188); // Tall top apex
        bCtx.bezierCurveTo(2, -195, -98, -125, -122, -55);  // Outer scalloped margin
        bCtx.bezierCurveTo(-132, -12, -85, 22, 0, 10);
        bCtx.closePath();
        bCtx.fill();

        // Crisp Neon Rim Highlight Along Wing Margin
        bCtx.lineWidth = isGhostCopy ? 1.2 : 2.4;
        bCtx.strokeStyle = isGhostCopy ? pal.wingMid : pal.wingEdge;
        bCtx.stroke();

        // Internal Bioluminescent Wing Veins
        if (!isGhostCopy) {
          bCtx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
          bCtx.lineWidth = 1.1;
          bCtx.beginPath();
          bCtx.moveTo(-4, 4); bCtx.quadraticCurveTo(-32, -75, -24, -172);
          bCtx.moveTo(-8, 0); bCtx.quadraticCurveTo(-52, -68, -74, -128);
          bCtx.moveTo(-10, -2); bCtx.quadraticCurveTo(-68, -45, -108, -68);
          bCtx.moveTo(-12, -4); bCtx.quadraticCurveTo(-65, -18, -105, -22);
          bCtx.stroke();
        }
      } else {
        // LOWER HIND-WING GEOMETRY (Rounded iridescent lobe with bright energy core)
        const hGrad = bCtx.createRadialGradient(-10, 15, 5, -38, 48, 115);
        hGrad.addColorStop(0, '#ffffff');
        hGrad.addColorStop(0.32, pal.wingEdge);
        hGrad.addColorStop(0.68, pal.wingMid);
        hGrad.addColorStop(1, 'rgba(0,0,0,0)');

        bCtx.globalAlpha = 0.92 * alphaMul;
        bCtx.fillStyle = hGrad;
        bCtx.beginPath();
        bCtx.moveTo(0, 12);
        bCtx.bezierCurveTo(-78, 8, -112, 42, -88, 86);
        bCtx.bezierCurveTo(-64, 118, -18, 98, -4, 52);
        bCtx.closePath();
        bCtx.fill();

        bCtx.lineWidth = 2.0;
        bCtx.strokeStyle = pal.wingEdge;
        bCtx.stroke();
      }

      bCtx.restore();
    }

    // 2. Render Ghost/Echo Trail Wings Shooting Diagonal Top-Right (Visible in Video at 00:00, 00:05!)
    renderWing(-rightWingSpan * 0.95, 28, true, true, 68);
    renderWing(-rightWingSpan * 0.85, 32, true, true, 102);

    // 3. Render Right (Background) Wing Pair
    renderWing(-rightWingSpan, 22, true, false, 0);
    renderWing(-rightWingSpan * 0.9, 26, false, false, 0);

    // 4. Render Left (Foreground Dominant) Wing Pair
    renderWing(leftWingSpan, -8, true, false, 0);
    renderWing(leftWingSpan * 0.96, -4, false, false, 0);

    // 5. Blazing White-Hot Energy Core at Thorax & Lower Wing Junction
    const coreGrad = bCtx.createRadialGradient(cx - 14, cy + 28, 2, cx - 14, cy + 28, 56);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.45, pal.coreBloom);
    coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
    bCtx.fillStyle = coreGrad;
    bCtx.beginPath();
    bCtx.arc(cx - 14, cy + 28, 56, 0, Math.PI * 2);
    bCtx.fill();

    bCtx.restore();

    // Compute Tracked 2D Feature Nodes for the TouchDesigner CV Overlay!
    const apexX = cx - leftWingSpan * 36;
    const apexY = cy - 178;
    const outerLeftX = cx - leftWingSpan * 112;
    const outerLeftY = cy - 52;
    const lowerCoreX = cx - leftWingSpan * 56;
    const lowerCoreY = cy + 54;
    const rightTipX = cx + rightWingSpan * 82;
    const rightTipY = cy - 92;
    const tailX = cx + 18;
    const tailY = cy + 88;

    return {
      cx, cy,
      leftWingSpan,
      nodes: [
        { x: apexX, y: apexY, r: 12, boxW: 96, boxH: 135, isPrimary: true },
        { x: apexX + 26, y: apexY + 24, r: 8, isCluster: true },
        { x: outerLeftX, y: outerLeftY, r: 22 },
        { x: lowerCoreX, y: lowerCoreY, r: 34, boxW: 68, boxH: 64, isCore: true },
        { x: rightTipX, y: rightTipY, r: 18 },
        { x: cx + 28, y: cy + 14, r: 14 },
        { x: tailX, y: tailY, r: 10 },
        { x: cx + 64, y: cy + 48, r: 8 }
      ]
    };
  }

  // =========================================================================
  // 4. POST-PROCESSING: SLIT-SCAN GLITCH SLICING & RGB CHROMATIC ABERRATION
  // =========================================================================
  function compositeGlitchToScreen(isGlitchFrame, pal) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // Base pass: draw offscreen buffer onto main canvas
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(bufferCanvas, 0, 0);

    // Chromatic Aberration Pass (Offset Red/Magenta & Cyan Ghost Channels)
    const abShift = (isGlitchFrame ? 9 : 2.5) * glitchIntensity * dpr;
    if (abShift > 1) {
      ctx.globalAlpha = isGlitchFrame ? 0.55 : 0.28;
      ctx.drawImage(bufferCanvas, -abShift, -abShift * 0.3);
      ctx.drawImage(bufferCanvas, abShift, abShift * 0.3);
      ctx.globalAlpha = 1.0;
    }

    // Horizontal Slit-Scan Glitch Slicing (Displaces thin horizontal strips across the butterfly)
    const sliceCount = isGlitchFrame
      ? Math.floor(10 + glitchIntensity * 18)
      : Math.floor(2 + glitchIntensity * 5);

    const centerY = H * 0.49 * dpr;
    const wingBandH = 230 * dpr;

    for (let i = 0; i < sliceCount; i++) {
      const sy = centerY + (Math.random() - 0.5) * wingBandH * 2;
      const sh = (Math.random() * 14 + 2) * dpr;
      const maxShift = (isGlitchFrame ? 68 : 18) * glitchIntensity * dpr;
      const dx = (Math.random() - 0.42) * maxShift; // Slight bias to the right like video!

      ctx.globalAlpha = Math.random() * 0.65 + 0.25;
      ctx.drawImage(
        bufferCanvas,
        0, sy, bufferCanvas.width, sh,
        dx, sy + (Math.random() - 0.5) * 4 * dpr, bufferCanvas.width, sh
      );
    }

    ctx.restore();
  }

  // =========================================================================
  // 5. TOUCHDESIGNER COMPUTER-VISION BLOB TRACKER HUD OVERLAY
  //    (Red Bounding Boxes, Dashed Circles, Plexus Lines & `x: 283 y: 518`)
  // =========================================================================
  function drawTouchDesignerHud(trackingData, t, isGlitchFrame) {
    if (!showCvHud) return;

    // Like the reference video, the CV overlay flickers in/out on some frames
    if (Math.random() < 0.08 && !isGlitchFrame) return;

    const { nodes } = trackingData;
    ctx.save();
    ctx.scale(dpr, dpr);

    // 1. White/Grey Plexus Connection Lines Between Tracked Vertices
    ctx.strokeStyle = 'rgba(226, 232, 240, 0.45)';
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    for (let i = 0; i < nodes.length - 1; i++) {
      ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(nodes[i + 1].x, nodes[i + 1].y);
      if (i + 2 < nodes.length) {
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[i + 2].x, nodes[i + 2].y);
      }
    }
    ctx.stroke();

    // 2. Red Bounding Boxes Around Primary Wing Blob & Core Blob (Exact Match to Video!)
    nodes.forEach((n, idx) => {
      if (n.boxW && n.boxH) {
        const bx = n.isPrimary ? n.x - 18 : n.x - n.boxW * 0.5;
        const by = n.isPrimary ? n.y - 8 : n.y - n.boxH * 0.5;
        const jitterX = isGlitchFrame ? (Math.random() - 0.5) * 8 : 0;
        const jitterY = isGlitchFrame ? (Math.random() - 0.5) * 8 : 0;

        ctx.strokeStyle = 'rgba(239, 68, 68, 0.88)';
        ctx.lineWidth = 1.15;
        ctx.setLineDash([]);
        ctx.strokeRect(bx + jitterX, by + jitterY, n.boxW, n.boxH);

        // Top-Left Coordinate Readout Above Red Box (`x: 283 y: 518`)
        const dispX = Math.round(230 + (bx - W * 0.35) * 1.4);
        const dispY = Math.round(510 + (by - H * 0.28) * 1.6);
        ctx.font = '600 11px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(248, 250, 252, 0.92)';
        ctx.fillText(`x: ${dispX} y: ${dispY}`, bx + jitterX, by + jitterY - 6);
      }

      // 3. Dashed Target Circles Around Wing Feature Nodes
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.72)';
      ctx.lineWidth = 0.9;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.stroke();

      // Tiny Center Crosshair Dot
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(n.x - 1.5, n.y - 1.5, 3, 3);

      // 4. Coordinate Labels Next to Tracked Nodes (`x: 611 y: 582`, `x: 531 y: 886`, etc.)
      if (!n.isPrimary) {
        const coordX = Math.round(470 + (n.x - W * 0.42) * 1.8 + Math.sin(t * 8 + idx) * 4);
        const coordY = Math.round(580 + (n.y - H * 0.32) * 2.1 + Math.cos(t * 7 + idx) * 4);
        const labelOffsetX = idx % 2 === 0 ? 12 : -78;
        const labelOffsetY = idx % 3 === 0 ? -8 : 14;

        ctx.font = '600 10.5px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(241, 245, 249, 0.88)';
        ctx.fillText(`x: ${coordX} y: ${coordY}`, n.x + labelOffsetX, n.y + labelOffsetY);
      }
    });

    ctx.restore();
  }

  // =========================================================================
  // 6. MAIN ANIMATION LOOP
  // =========================================================================
  let startTime = performance.now();
  const phaseReadout = document.getElementById('phaseReadout');

  function animate(now) {
    const t = (now - startTime) * 0.001;

    // 1. Determine Active Color Spectrum (Auto-cycles between Cobalt-Cyan and Magenta-Gold like the video!)
    if (colorMode === 'auto') {
      // Switch between Cyan (0..3s) and Magenta (3..6s) with brief rapid flicker during transition
      const cycle = t % 6.4;
      const inTransition = (cycle > 2.85 && cycle < 3.15) || (cycle > 6.1);
      if (inTransition) {
        activePaletteKey = Math.random() < 0.5 ? 'cyan' : 'magenta';
        burstTimer = Math.max(burstTimer, 3);
      } else {
        activePaletteKey = cycle < 3.0 ? 'cyan' : 'magenta';
      }
    } else {
      activePaletteKey = colorMode;
    }

    const pal = PALETTES[activePaletteKey];
    phaseReadout.textContent = `PHASE: ${pal.name}`;
    phaseReadout.style.color = pal.tagColor;

    // Decide if current frame is a heavy glitch burst frame
    const isGlitchFrame = burstTimer > 0 || Math.random() < (0.14 * glitchIntensity);
    if (burstTimer > 0) burstTimer--;

    // 2. Clear Main Screen & Render Twinkling Deep-Space Dust
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr);

    bgStars.forEach(s => {
      s.phase += s.twinkleSpeed;
      const a = s.alpha * (0.5 + 0.5 * Math.sin(s.phase));
      ctx.fillStyle = `rgba(220, 215, 255, ${a.toFixed(2)})`;
      ctx.fillRect(s.x * W, s.y * H, s.size, s.size);
    });
    ctx.restore();

    // 3. Render Clean Bioluminescent Butterfly to Offscreen Buffer
    const trackingData = drawButterflyToBuffer(t, pal, isGlitchFrame);

    // 4. Composite Buffer onto Main Screen with Horizontal Glitch Slicing & RGB Split
    compositeGlitchToScreen(isGlitchFrame, pal);

    // 5. Update & Render Quantum Wing Sparks / Glitch Voxels
    spawnWingSparks(trackingData.cx, trackingData.cy, pal, isGlitchFrame ? 7 : 3);

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;

      if (p.life <= 0) {
        sparks.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;

      if (p.isSquare) {
        // Digital pixel/voxel squares around wings
        ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size * 0.75);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // 6. Render TouchDesigner Computer-Vision Tracking Boxes & Coordinates Over Everything
    drawTouchDesignerHud(trackingData, t, isGlitchFrame);

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

  // =========================================================================
  // 7. USER INTERACTIONS (CLICK BURST, PALETTE SWITCHER, HUD TOGGLE)
  // =========================================================================
  function triggerGlitchBurst() {
    burstTimer = 18;
    if (colorMode === 'auto') {
      activePaletteKey = activePaletteKey === 'cyan' ? 'magenta' : 'cyan';
    }
  }

  canvas.addEventListener('pointerdown', triggerGlitchBurst);
  document.getElementById('triggerBurstBtn').addEventListener('click', triggerGlitchBurst);

  document.querySelectorAll('#paletteGroup .td-pill-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#paletteGroup .td-pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      colorMode = btn.dataset.mode;
      burstTimer = 12;
    });
  });

  const hudBtn = document.getElementById('toggleHudBtn');
  hudBtn.addEventListener('click', () => {
    showCvHud = !showCvHud;
    hudBtn.classList.toggle('active', showCvHud);
    hudBtn.textContent = showCvHud ? '🎯 TRACKING BOXES: ON' : '🎯 TRACKING BOXES: OFF';
  });

  document.getElementById('glitchSlider').addEventListener('input', (e) => {
    glitchIntensity = Number(e.target.value) / 100;
  });
})();
</script>
