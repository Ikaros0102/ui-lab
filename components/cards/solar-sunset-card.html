<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  "techniques": ["pure OLED black (#000000 / #050403) body", "intense sunset radial-gradient flare", "conic amber-to-crimson border glow", "color-mix(in srgb, #ff7a00, transparent)", "glassmorphic backdrop blur"],
  "recipe": "The sunrise/sunset atmosphere is achieved by placing an expansive multi-color radial gradient (amber #ff9e00 to incandescent orange #ff4500 and deep purple) on a blurred ::after layer behind an absolute pitch-black (#040302) container. The upper rim features an acute conic highlight simulating direct sunlight glancing off chamfered glass.",

<style>
  * { box-sizing: border-box; }

  :root {
    --void-black: #040302;
    --solar-gold: #f59e0b;
    --solar-amber: #f97316;
    --solar-crimson: #ef4444;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 10%, #150904 0%, #030201 80%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fef3c7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* Solar Flare Card */
  .solar-card {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: #050403;
    border-radius: 24px;
    padding: 34px 30px;
    border: 1px solid rgba(245, 158, 11, 0.15);
    box-shadow: 
      0 35px 80px rgba(0, 0, 0, 0.95),
      0 0 90px rgba(249, 115, 22, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    overflow: hidden;
    isolation: isolate;
  }

  /* Radiant Sunset Haze (::after) */
  .solar-card::after {
    content: "";
    position: absolute;
    inset: -70px;
    background: 
      radial-gradient(circle at 85% 15%, rgba(245, 158, 11, 0.25) 0%, transparent 40%),
      radial-gradient(circle at 15% 40%, rgba(249, 115, 22, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 50% 95%, rgba(239, 68, 68, 0.14) 0%, transparent 40%);
    filter: blur(40px);
    z-index: -1;
    pointer-events: none;
  }

  /* Rim light on top right edge */
  .solar-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(
      from 290deg,
      transparent 0deg,
      rgba(245, 158, 11, 0.6) 45deg,
      rgba(249, 115, 22, 0.4) 90deg,
      transparent 160deg,
      rgba(239, 68, 68, 0.25) 240deg,
      transparent 320deg
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .solar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .badge-solar {
    background: rgba(245, 158, 11, 0.12);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card-titles h3 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 30%, #fde68a 70%, #f59e0b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card-titles p {
    margin: 8px 0 0;
    font-size: 14px;
    color: #a89479;
    line-height: 1.55;
  }

  /* Solar Energy Metric Row */
  .energy-row {
    background: #090704;
    border: 1px solid rgba(245, 158, 11, 0.12);
    border-radius: 16px;
    padding: 20px;
    margin: 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .energy-num {
    font-size: 32px;
    font-weight: 800;
    color: #f59e0b;
    text-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
    line-height: 1;
  }

  .energy-sub {
    font-size: 11.5px;
    color: #8c7657;
    margin-top: 4px;
  }

  .solar-dial {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(245, 158, 11, 0.3);
    position: relative;
    display: grid;
    place-items: center;
  }
  .solar-dial::after {
    content: "☀";
    color: #f59e0b;
    font-size: 22px;
  }

  .card-footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 20px;
  }

  .btn-solar {
    background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #ffffff;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(245, 158, 11, 0.25);
    transition: all 0.2s;
  }
  .btn-solar:hover {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    box-shadow: 0 0 24px rgba(245, 158, 11, 0.45);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="solar-card">
  <div class="solar-header">
    <span class="badge-solar">Dawn Phase</span>
    <span style="font-size: 12px; color: #a89479; font-family: monospace;">SOL-01 · 05:42 AM</span>
  </div>

  <div class="card-titles">
    <h3>Helios Thermal Core</h3>
    <p>Peak morning solar irradiance harvesting telemetry from parabolic collector arrays.</p>
  </div>

  <div class="energy-row">
    <div>
      <div class="energy-num">1.48 GW</div>
      <div class="energy-sub">Flux Efficiency: 94.2% · Optimum</div>
    </div>
    <div class="solar-dial"></div>
  </div>

  <div class="card-footer-bar">
    <span style="font-size: 12px; color: #8c7657;">All collectors aligned</span>
    <button class="btn-solar">Engage Dynamos</button>
  </div>
</div>

</body>
</html>
