<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mars Wireframe HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<script type="application/json" data-uilab-meta>
{
  "title": "Mars Wireframe HUD",
  "category": "widgets",
  "themes": ["dark", "retro"],
  "tags": ["space", "hud", "mars", "planet", "wireframe", "canvas", "sci-fi", "mint", "loading"],
  "description": "Mint-on-black planetary HUD: a textured Mars sphere wrapped in a rotating canvas-drawn node mesh, with side gauges, equalizer strip, mini map, hex badge counter and a loading bar.",
  "techniques": ["canvas 3D point sphere with connecting lines", "radial-gradient planet texture", "clip-path chamfered panels", "SVG circular gauges with stroke-dashoffset", "requestAnimationFrame paused when off-screen"],
  "recipe": "The mesh around the planet is drawn on a 2D canvas: points are distributed on a sphere with the golden-angle spiral, rotated each frame around the Y axis, projected with a simple perspective divide, and connected whenever two points are closer than a threshold. Line alpha depends on depth so the back of the sphere fades out. The planet itself is only radial-gradients, so the whole HUD stays small. The animation loop stops when the tab is hidden.",
  "preview": { "mode": "page", "width": 1000, "height": 640 }
}
</script>

<style>
  * { box-sizing: border-box; }
  :root { --mint: #7fe8c8; --mint-dim: rgba(127,232,200,.35); --mint-faint: rgba(127,232,200,.12); --text: #bfe9dc; --muted: #5a8277; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: #010204; color: var(--text);
    font: 10px/1.4 "Share Tech Mono", ui-monospace, monospace; letter-spacing: .1em; overflow: hidden;
  }
  .hud {
    position: relative; width: 960px; height: 600px; border-radius: 12px; border: 1px solid var(--mint-faint);
    background:
      linear-gradient(var(--mint-faint) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--mint-faint) 1px, transparent 1px) 0 0 / 40px 40px,
      radial-gradient(60% 70% at 50% 50%, #0b1015, #040609 80%);
    overflow: hidden;
  }
  .hud::before, .hud::after { content: ""; position: absolute; width: 60px; height: 14px; border: 1px solid var(--mint-dim); }
  .hud::before { left: 10px; top: 10px; border-right: 0; border-bottom: 0; }
  .hud::after  { right: 10px; bottom: 10px; border-left: 0; border-top: 0; }

  .ticker { position: absolute; top: 14px; left: 200px; right: 200px; height: 18px; border-top: 2px solid var(--mint); border-bottom: 1px solid var(--mint-faint); display: flex; justify-content: space-between; color: var(--muted); font-size: 8px; padding-top: 2px; }
  .ticker span:nth-child(odd) { color: var(--mint); }

  canvas#mesh { z-index: 2; pointer-events: none; position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -230px 0 0 -230px; }
  .planet {
    position: absolute; left: 50%; top: 50%; width: 270px; height: 270px; margin: -135px 0 0 -135px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 32%, rgba(255,210,170,.5), transparent 38%),
      radial-gradient(ellipse 40% 12% at 40% 58%, rgba(90,30,15,.55), transparent 70%),
      radial-gradient(ellipse 28% 9% at 62% 40%, rgba(90,30,15,.4), transparent 70%),
      radial-gradient(circle at 40% 40%, #e98a52, #b4501f 55%, #4a1b0a 85%);
    box-shadow: inset -40px -26px 70px rgba(0,0,0,.85), 0 0 50px rgba(220,100,40,.28);
    animation: drift 40s linear infinite; background-size: 140% 140%, 100% 100%, 100% 100%, 100% 100%;
  }
  @keyframes drift { to { background-position: 140% 0, 0 0, 0 0, 0 0; } }

  .panel { position: absolute; border: 1px solid var(--mint-dim); background: rgba(127,232,200,.04); }
  .title { left: 38px; top: 140px; width: 120px; padding: 6px 10px; font-size: 18px; letter-spacing: .5em; color: var(--mint); }
  .globe-chip { left: 38px; top: 184px; width: 120px; height: 56px; display: grid; place-items: center; }
  .globe-chip i { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--mint); position: relative; }
  .globe-chip i::before, .globe-chip i::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--mint-dim); border-radius: 50%; }
  .globe-chip i::before { transform: scaleX(.45); } .globe-chip i::after { transform: scaleY(.45); }
  svg.gauge { position: absolute; }
  .gauge circle { fill: none; stroke: var(--mint-dim); }
  .gauge .arc { stroke: var(--mint); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .6s; }
  .gauge text { fill: var(--mint); font: 10px "Share Tech Mono"; }

  .populate { position: absolute; left: 38px; bottom: 130px; display: flex; gap: 8px; align-items: center; }
  .hex { width: 40px; height: 44px; background: var(--mint-dim); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center; }
  .hex::after { content: ""; width: 34px; height: 38px; background: #0a1210; clip-path: inherit; }
  .count { border: 1px solid var(--mint-dim); padding: 4px 10px; font-size: 15px; color: var(--mint); min-width: 60px; text-align: center; }
  .count button { all: unset; cursor: pointer; padding: 0 6px; color: var(--muted); } .count button:hover { color: var(--mint); }

  .map { position: absolute; left: 100px; bottom: 28px; width: 220px; height: 84px; background:
    radial-gradient(circle, var(--mint-dim) 1px, transparent 1.4px) 0 0 / 6px 6px; opacity: .8;
    -webkit-mask: radial-gradient(ellipse at 30% 50%, #000 20%, transparent 22%), radial-gradient(ellipse at 62% 40%, #000 18%, transparent 20%), radial-gradient(ellipse at 80% 62%, #000 12%, transparent 14%);
    mask: radial-gradient(ellipse at 30% 50%, #000 20%, transparent 22%), radial-gradient(ellipse at 62% 40%, #000 18%, transparent 20%), radial-gradient(ellipse at 80% 62%, #000 12%, transparent 14%); border: 0; }
  .map-frame { position: absolute; left: 100px; bottom: 28px; width: 220px; height: 84px; border: 1px solid var(--mint-dim); }

  .eq { right: 40px; top: 120px; width: 150px; height: 26px; display: flex; align-items: center; gap: 2px; padding: 4px 6px; }
  .eq i { flex: 1; background: var(--mint); height: calc(var(--h) * 1%); opacity: .8; }
  .console { right: 40px; top: 170px; width: 150px; padding: 8px; display: grid; gap: 6px; }
  .console .row { display: flex; justify-content: space-between; align-items: center; }
  .knob { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--mint); cursor: pointer; position: relative; }
  .knob::after { content: ""; position: absolute; left: 50%; top: 2px; width: 1px; height: 6px; background: var(--mint); transform-origin: 0 7px; transform: rotate(var(--a, 0deg)); }
  .readouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; color: var(--mint); font-size: 8px; text-align: center; }
  .stars { right: 40px; top: 360px; width: 40px; padding: 6px 0; display: grid; justify-items: center; gap: 4px; color: var(--mint); font-size: 9px; }
  .stars span { width: 6px; height: 6px; background: var(--mint); } .stars span.off { background: transparent; border: 1px solid var(--mint-dim); }
  .table { right: 100px; bottom: 36px; width: 120px; height: 70px; background: repeating-linear-gradient(0deg, var(--mint-faint) 0 1px, transparent 1px 8px); }

  .loader { position: absolute; left: 50%; bottom: 20px; width: 260px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; }
  .loader .bar { flex: 1; height: 14px; border: 1px solid var(--mint-dim); clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .loader .bar i { display: block; height: 100%; width: var(--p, 100%); background: var(--mint-dim); transition: width .4s; }
  .loader button { all: unset; cursor: pointer; color: var(--mint); border: 1px solid var(--mint-dim); padding: 2px 8px; }
</style>
</head>
<body>
<div class="hud">
  <div class="ticker" id="ticker"></div>

  <canvas id="mesh" width="920" height="920"></canvas>
  <div class="planet"></div>

  <div class="panel title">MARS</div>
  <div class="panel globe-chip"><i></i></div>

  <svg class="gauge" style="left:38px;top:40px" width="90" height="90" viewBox="0 0 90 90">
    <circle cx="45" cy="45" r="36"/><circle cx="45" cy="45" r="28" stroke-dasharray="3 4"/>
    <circle class="arc" id="arc" cx="45" cy="45" r="36" stroke-dasharray="226" stroke-dashoffset="70" transform="rotate(-90 45 45)"/>
    <text x="45" y="49" text-anchor="middle" id="arcTxt">69%</text>
  </svg>
  <svg class="gauge" style="left:48px;top:256px" width="70" height="70" viewBox="0 0 70 70">
    <circle cx="35" cy="35" r="30"/><circle cx="35" cy="35" r="22" stroke-dasharray="2 5"/>
  </svg>

  <div class="populate"><div class="hex"></div><div class="count"><button id="dec">−</button><span id="cnt">09</span><button id="inc">+</button></div></div>
  <div class="map"></div><div class="map-frame"></div>

  <div class="panel eq" id="eq"></div>
  <div class="panel console">
    <div class="row"><span>GAIN</span><span class="knob" data-k></span></div>
    <div class="row"><span>PHASE</span><span class="knob" data-k></span></div>
    <div class="row"><span>ORBIT</span><span class="knob" data-k></span></div>
    <div class="readouts"><span id="r0">42.1</span><span id="r1">07.3</span><span id="r2">18.9</span><span id="r3">64.0</span></div>
  </div>
  <div class="panel stars" id="stars"></div>
  <div class="panel table"></div>

  <div class="loader"><span>100%</span><div class="bar"><i id="loadFill"></i></div><button id="reload">LOADING</button></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  $("ticker").innerHTML = Array.from({ length: 18 }, (_, i) => `<span>${String(i * 37 % 999).padStart(3, "0")}</span>`).join("");
  $("eq").innerHTML = Array.from({ length: 22 }, () => "<i></i>").join("");
  $("stars").innerHTML = Array.from({ length: 5 }, (_, i) => `<span class="${i > 3 ? "off" : ""}"></span>`).join("");

  // ---------- canvas node mesh ----------
  const cv = $("mesh"), ctx = cv.getContext("2d"), N = 90, R = 700, C = 460;
  const pts = Array.from({ length: N }, (_, i) => {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = i * 2.399963;
    return { x: Math.cos(t) * r, y, z: Math.sin(t) * r };
  });
  let ang = 0, running = true, raf = 0;
  function frame() {
    ang += 0.0035;
    const ca = Math.cos(ang), sa = Math.sin(ang), tilt = 0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
    const P = pts.map((p) => {
      const x = p.x * ca + p.z * sa, z0 = -p.x * sa + p.z * ca;
      const y = p.y * ct - z0 * st, z = p.y * st + z0 * ct, s = 1 / (2.2 - z * 0.4);
      return { x: C + x * R * s, y: C + y * R * s, z };
    });
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 190) { ctx.strokeStyle = `rgba(220,235,235,${(1 - d / 190) * 0.45 * (0.3 + (a.z + b.z + 2) / 4)})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of P) { ctx.fillStyle = `rgba(255,255,255,${0.35 + (p.z + 1) * 0.3})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); }
    if (running) raf = requestAnimationFrame(frame);
  }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { running = false; frame(); } else frame();
  document.addEventListener("visibilitychange", () => { running = !document.hidden && !reduce; if (running) frame(); });

  // ---------- equalizer + readouts ----------
  setInterval(() => {
    document.querySelectorAll("#eq i").forEach((b) => b.style.setProperty("--h", 20 + Math.random() * 80));
    ["r0", "r1", "r2", "r3"].forEach((id) => $(id).textContent = (Math.random() * 90).toFixed(1).padStart(4, "0"));
  }, 450);

  // ---------- gauge, counter, knobs, loader ----------
  const arc = $("arc"), arcTxt = $("arcTxt");
  let pct = 69;
  const setPct = (v) => { pct = (v + 101) % 101; arc.style.strokeDashoffset = 226 * (1 - pct / 100); arcTxt.textContent = pct + "%"; };
  setPct(pct); $("arcTxt").parentNode.addEventListener("click", () => setPct(pct + 11));

  let cnt = 9; const showCnt = () => $("cnt").textContent = String(cnt).padStart(2, "0");
  $("inc").onclick = () => { cnt = Math.min(99, cnt + 1); showCnt(); }; $("dec").onclick = () => { cnt = Math.max(0, cnt - 1); showCnt(); };

  document.querySelectorAll("[data-k]").forEach((k) => { let a = 0; k.addEventListener("click", () => { a = (a + 60) % 360; k.style.setProperty("--a", a + "deg"); }); });

  $("reload").onclick = () => {
    const f = $("loadFill"); f.style.transition = "none"; f.style.setProperty("--p", "0%");
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = "width 1.6s linear"; f.style.setProperty("--p", "100%"); }));
  };
</script>
</body>
</html>
