<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Glitch RGB Split Typography</title>

<!-- VT323 Monospace font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<script type="application/json" data-uilab-meta>
{
  "title": "Chromatic Glitch RGB Split Typography",
  "category": "text-effects",
  "themes": ["retro", "dark"],
  "tags": ["text-effects", "glitch", "rgb-split", "chromatic", "distortion", "cyberpunk", "typography"],
  "description": "Distorted analog RGB-split chromatic glitch typography with horizontal scan slice tears and jitter displacement keyframes.",
  "techniques": ["attr(data-text) pseudo-element duplication", "clip-path: inset() horizontal slices", "mix-blend-mode: screen RGB chromatic separation", "steps() jitter animation", "scanline distortion grid"],
  "recipe": "The chromatic aberration glitch is created without duplicating DOM nodes by utilizing data-text attributes on ::before and ::after pseudoelements. One layer carries a pure cyan text-shadow, the other red-magenta. Rapid @keyframes loops apply randomized clip-path: inset() horizontal slice windows, producing genuine VHS tracking tears.",
  "preview": { "mode": "center", "width": 540, "height": 380 }
}
</script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #050608;
    color: #ffffff;
    font-family: 'VT323', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .glitch-wrap {
    position: relative;
    padding: 20px;
  }

  .glitch-title {
    position: relative;
    font-size: clamp(48px, 10vw, 84px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ffffff;
    margin: 0;
    user-select: none;
  }

  /* Glitch Layer 1: Red/Magenta Offset */
  .glitch-title::before {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: -2px;
    width: 100%;
    height: 100%;
    color: #ff0055;
    background: transparent;
    clip-path: inset(0 0 0 0);
    animation: glitchAnim1 2.2s infinite linear alternate-reverse;
  }

  /* Glitch Layer 2: Cyan Offset */
  .glitch-title::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 2px;
    width: 100%;
    height: 100%;
    color: #00ffff;
    background: transparent;
    clip-path: inset(0 0 0 0);
    animation: glitchAnim2 2.8s infinite linear alternate-reverse;
  }

  @keyframes glitchAnim1 {
    0% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 1px); }
    20% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
    40% { clip-path: inset(40% 0 45% 0); transform: translate(-1px, 2px); }
    60% { clip-path: inset(10% 0 85% 0); transform: translate(3px, 1px); }
    80% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -1px); }
    100% { clip-path: inset(15% 0 65% 0); transform: translate(1px, 2px); }
  }

  @keyframes glitchAnim2 {
    0% { clip-path: inset(10% 0 75% 0); transform: translate(3px, -1px); }
    25% { clip-path: inset(65% 0 20% 0); transform: translate(-2px, 1px); }
    50% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -2px); }
    75% { clip-path: inset(85% 0 5% 0); transform: translate(-3px, 2px); }
    100% { clip-path: inset(5% 0 80% 0); transform: translate(2px, 0); }
  }

  .tagline {
    font-size: 16px;
    color: #00ffff;
    letter-spacing: 0.25em;
    margin-top: 10px;
    text-align: center;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="glitch-wrap">
  <h1 class="glitch-title" data-text="SYSTEM CORRUPT">SYSTEM CORRUPT</h1>
  <div class="tagline">// MEMORY LEAK DETECTED</div>
</div>

</body>
</html>
