<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Orbit Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">

<script type="application/json" data-uilab-meta>
{
  "title": "Solar System Orbit Atlas",
  "category": "widgets",
  "themes": ["dark"],
  "tags": ["space", "solar-system", "infographic", "orbits", "planets", "poster", "3d-transform", "data-cards"],
  "description": "Editorial solar system infographic: a tilted orbital plane with animated planets, surrounded by planet fact cards that highlight their orbit on hover.",
  "techniques": ["transform: rotateX() tilted orbit plane", "nested rotating wrappers for orbits", "radial-gradient planet spheres", "hover-linked orbit highlighting via :has()", "key-value fact tables"],
  "recipe": "The orbit map is a flat container tilted with rotateX(68deg) so concentric circles read as ellipses. Each planet sits at the edge of a wrapper that spins around the centre, which gives an orbit without any JavaScript. Planet bodies are radial-gradients with an inset shadow for the terminator. Hovering a fact card toggles a data attribute on the stage, and :has() / attribute selectors brighten the matching orbit ring.",
  "preview": { "mode": "page", "width": 1000, "height": 700 }
}
</script>

<style>
  * { box-sizing: border-box; }
  :root { --gold: #f1b24a; --line: rgba(255,255,255,.18); }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #000; color: #dfe3ea; font: 11px/1.4 "Barlow", system-ui, sans-serif; overflow: hidden;
  }
  .poster {
    position: relative; width: 960px; height: 660px;
    background:
      radial-gradient(60% 40% at 50% -10%, rgba(255,120,30,.5), transparent 70%),
      radial-gradient(1px 1px at 12% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 18%, #fff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 88% 66%, #fff, transparent), #02030a;
    border: 1px solid #222;
    overflow: hidden;
  }
  .title { position: absolute; left: 18px; top: 14px; }
  .title h1 { margin: 0; font: 700 22px "Barlow Condensed"; letter-spacing: .12em; color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 2px; }
  .title p { margin: 4px 0 0; font: 500 15px "Barlow Condensed"; letter-spacing: .06em; }

  /* ---------- planet cards ---------- */
  .card {
    position: absolute; width: 190px; display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center;
    padding: 6px; border: 1px solid transparent; cursor: pointer; transition: border-color .2s, background .2s;
  }
  .card:hover, .card[data-active] { border-color: var(--gold); background: rgba(241,178,74,.07); }
  .card h3 { grid-column: 2; margin: 0; font: 700 11px "Barlow Condensed"; letter-spacing: .3em; color: var(--gold); }
  .card dl { grid-column: 2; margin: 0; display: grid; grid-template-columns: 1fr auto; font-size: 8px; color: #aab; gap: 1px 6px; }
  .card dd { margin: 0; color: #fff; }
  .sphere {
    grid-row: 1 / span 2; width: 64px; height: 64px; border-radius: 50%;
    background: var(--g); box-shadow: inset -14px -8px 22px rgba(0,0,0,.7), 0 0 14px var(--glow, transparent);
    position: relative; overflow: hidden;
  }
  .sphere::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(255,255,255,.06) 0 3px, transparent 3px 8px); mix-blend-mode: overlay; }

  .mercury { --g: radial-gradient(circle at 32% 30%, #bdb5aa, #6f685f 60%, #2b2824); left: 215px; top: 62px; }
  .mars    { --g: radial-gradient(circle at 32% 30%, #e8946a, #a6482a 62%, #3b1710); left: 440px; top: 8px; }
  .venus   { --g: radial-gradient(circle at 32% 30%, #f0b27a, #b86a36 60%, #4a2410); left: 10px; top: 150px; }
  .earth   { --g: radial-gradient(circle at 32% 30%, #7fc4ff, #2a67b8 55%, #0c2548); left: 10px; top: 290px; --glow: rgba(80,160,255,.4); }
  .neptune { --g: radial-gradient(circle at 32% 30%, #6ea8ff, #2a4fb0 62%, #0d1a47); left: 10px; top: 430px; }
  .jupiter { --g: radial-gradient(circle at 32% 30%, #f2dcc0, #c79468 58%, #5a3a22); left: 745px; top: 130px; }
  .saturn  { --g: radial-gradient(circle at 32% 30%, #f5e6b8, #c9b26d 60%, #5c4a22); left: 745px; top: 380px; }
  .uranus  { --g: radial-gradient(circle at 32% 30%, #bff2f2, #6fc2c9 62%, #1f5560); left: 330px; top: 536px; }
  .sun     { --g: radial-gradient(circle at 40% 36%, #fff3b0, #ffa21a 50%, #d0450a); left: 745px; top: 530px; --glow: rgba(255,150,30,.7); }

  .card.mercury,.card.mars,.card.uranus { grid-template-columns: 64px 1fr; }
  .card .sphere.mercury, .card .sphere.mars, .card .sphere.venus, .card .sphere.earth, .card .sphere.neptune,
  .card .sphere.jupiter, .card .sphere.saturn, .card .sphere.uranus, .card .sphere.sun { position: relative; left: auto; top: auto; }

  /* ---------- orbit plane ---------- */
  .stage {
    position: absolute; left: 230px; top: 150px; width: 500px; height: 400px;
    perspective: 900px; display: grid; place-items: center;
  }
  .plane { position: relative; width: 460px; height: 460px; transform: rotateX(68deg); transform-style: preserve-3d; }
  .orbit {
    position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px solid var(--line);
    transform: translate(-50%, -50%); transition: border-color .25s, box-shadow .25s;
    animation: spin linear infinite;
  }
  .orbit i {
    position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 8px var(--c);
  }
  .orbit.o1 { width: 90px;  height: 90px;  --c: #c8bdae; animation-duration: 8s; }
  .orbit.o2 { width: 150px; height: 150px; --c: #e8a46b; animation-duration: 14s; }
  .orbit.o3 { width: 215px; height: 215px; --c: #6fb4ff; animation-duration: 20s; }
  .orbit.o4 { width: 280px; height: 280px; --c: #e0714a; animation-duration: 30s; }
  .orbit.o5 { width: 360px; height: 360px; --c: #e6c9a2; animation-duration: 48s; }
  .orbit.o6 { width: 440px; height: 440px; --c: #e9d79a; animation-duration: 70s; }
  .stage[data-hover="mercury"] .o1, .stage[data-hover="venus"] .o2, .stage[data-hover="earth"] .o3,
  .stage[data-hover="mars"] .o4, .stage[data-hover="jupiter"] .o5, .stage[data-hover="saturn"] .o6 {
    border-color: var(--gold); box-shadow: 0 0 14px rgba(241,178,74,.45), inset 0 0 14px rgba(241,178,74,.25);
  }
  .core {
    position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    background: radial-gradient(circle at 40% 36%, #fff3b0, #ffa21a 55%, #d0450a); box-shadow: 0 0 40px 10px rgba(255,150,30,.7);
  }
  .stage .label { position: absolute; top: 70px; font: 700 12px "Barlow Condensed"; letter-spacing: .4em; color: #8a93a5; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }

  .scale { position: absolute; right: 20px; top: 56px; width: 220px; font-size: 8px; color: #9aa; text-align: right; }
</style>
</head>
<body>
<div class="poster">
  <div class="title"><h1>SOLAR SYSTEM</h1><p>The Sun's Neighborhood</p></div>
  <div class="scale">Hover a planet card to highlight its orbit.</div>

  <div class="stage" id="stage">
    <div class="plane">
      <div class="orbit o1"><i></i></div><div class="orbit o2"><i></i></div><div class="orbit o3"><i></i></div>
      <div class="orbit o4"><i></i></div><div class="orbit o5"><i></i></div><div class="orbit o6"><i></i></div>
      <div class="core"></div>
    </div>
    <span class="label">INNER &nbsp; SOLAR &nbsp; SYSTEM</span>
  </div>

  <div id="cards"></div>
</div>

<script>
  const P = [
    ["mercury", "MERCURY", [["Distance from sun", "58.0M km"], ["Revolution", "88 days"], ["Equatorial diameter", "4,879 km"], ["Surface gravity", "0.38 g"]]],
    ["mars",    "MARS",    [["Distance from sun", "227.9M km"], ["Revolution", "687 days"], ["Equatorial diameter", "6,779 km"], ["Surface gravity", "0.38 g"]]],
    ["venus",   "VENUS",   [["Distance from sun", "108.2M km"], ["Revolution", "225 days"], ["Equatorial diameter", "12,104 km"], ["Surface gravity", "0.90 g"]]],
    ["earth",   "EARTH",   [["Distance from sun", "149.6M km"], ["Revolution", "365 days"], ["Equatorial diameter", "12,756 km"], ["Surface gravity", "1.00 g"]]],
    ["neptune", "NEPTUNE", [["Distance from sun", "4.5B km"], ["Revolution", "165 years"], ["Equatorial diameter", "49,244 km"], ["Surface gravity", "1.14 g"]]],
    ["jupiter", "JUPITER", [["Distance from sun", "778.5M km"], ["Revolution", "11.9 years"], ["Equatorial diameter", "139,820 km"], ["Surface gravity", "2.53 g"]]],
    ["saturn",  "SATURN",  [["Distance from sun", "1.43B km"], ["Revolution", "29.4 years"], ["Equatorial diameter", "116,460 km"], ["Surface gravity", "1.07 g"]]],
    ["uranus",  "URANUS",  [["Distance from sun", "2.87B km"], ["Revolution", "84 years"], ["Equatorial diameter", "50,724 km"], ["Surface gravity", "0.89 g"]]],
    ["sun",     "SUN",     [["Surface temperature", "5,500 °C"], ["Mass", "333,000 earths"], ["Equatorial diameter", "1.39M km"], ["Surface gravity", "27.9 g"]]]
  ];
  const stage = document.getElementById("stage");
  document.getElementById("cards").innerHTML = P.map(([id, name, rows]) => `
    <article class="card ${id}" data-id="${id}" tabindex="0">
      <div class="sphere ${id}"></div>
      <h3>${name}</h3>
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    </article>`).join("");

  const cards = document.getElementById("cards");
  const set = (id) => { if (id) stage.dataset.hover = id; else delete stage.dataset.hover; };
  cards.addEventListener("pointerover", (e) => set(e.target.closest(".card")?.dataset.id));
  cards.addEventListener("pointerleave", () => set());
  cards.addEventListener("focusin", (e) => set(e.target.closest(".card")?.dataset.id));
  cards.addEventListener("focusout", () => set());
</script>
</body>
</html>
