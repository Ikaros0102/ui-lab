<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: #05060a radial-gradient(circle at 50% 50%, #0c1020 0%, #030408 100%);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    color: #cbd5e1;
  }

  .loader-stage {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Particle Swarm */
  canvas#core-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Outer 3D Gyro Rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(99, 102, 241, 0.2);
    pointer-events: none;
  }

  .ring-1 {
    width: 250px;
    height: 250px;
    border-top-color: #6366f1;
    border-right-color: #a855f7;
    animation: spinClockwise 3.6s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
  }

  .ring-2 {
    width: 200px;
    height: 200px;
    border-bottom-color: #38bdf8;
    border-left-color: #818cf8;
    animation: spinCounter 2.8s linear infinite;
    filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
  }

  .ring-3 {
    width: 150px;
    height: 150px;
    border: 1px dashed rgba(255, 255, 255, 0.3);
    animation: spinClockwise 6s linear infinite;
  }

  @keyframes spinClockwise {
    to { transform: rotate(360deg); }
  }
  @keyframes spinCounter {
    to { transform: rotate(-360deg); }
  }

  /* Central Quantum Singularity */
  .singularity {
    position: relative;
    z-index: 2;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #1e1b4b 0%, #05060c 80%);
    box-shadow:
      0 0 25px rgba(99, 102, 241, 0.5),
      inset 0 0 14px rgba(168, 85, 247, 0.8),
      0 0 0 1px rgba(255, 255, 255, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .singularity-pct {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 0 8px #6366f1;
  }

  .singularity-lbl {
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 1px;
  }

  /* Telemetry Sub-Text */
  .telemetry-row {
    margin-top: 24px;
    display: flex;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #64748b;
  }
  .telemetry-val {
    color: #38bdf8;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="loader-stage">
    <canvas id="core-canvas" width="320" height="320"></canvas>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>

    <div class="singularity">
      <span class="singularity-pct" id="pct-val">84%</span>
      <span class="singularity-lbl">SYNCING</span>
    </div>
  </div>

  <div class="telemetry-row">
    <div>FLUX: <span class="telemetry-val">1.24 TWh</span></div>
    <div>HARMONIC: <span class="telemetry-val">432.8 Hz</span></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('core-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const centerX = w / 2;
  const centerY = h / 2;

  // Particle Accretion Model
  const particles = [];
  const PARTICLE_COUNT = 65;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      angle: Math.random() * Math.PI * 2,
      radius: 48 + Math.random() * 85,
      speed: 0.015 + Math.random() * 0.035,
      size: 1 + Math.random() * 2,
      alpha: 0.2 + Math.random() * 0.8,
      hue: Math.random() > 0.5 ? 240 : 190
    });
  }

  function render() {
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    particles.forEach(p => {
      p.angle += p.speed;
      const x = centerX + Math.cos(p.angle) * p.radius;
      const y = centerY + Math.sin(p.angle) * p.radius * 0.6; // slightly inclined orbit

      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${p.alpha})`;
      ctx.shadowColor = `hsla(${p.hue}, 90%, 60%, 0.8)`;
      ctx.shadowBlur = 6;
      ctx.fill();
    });

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // Progressive Sync Counter
  const pctEl = document.getElementById('pct-val');
  let pct = 10;
  setInterval(() => {
    pct = (pct + 1) > 99 ? 12 : pct + 1;
    pctEl.textContent = `${pct}%`;
  }, 120);
})();
</script>
</body>
</html>
