<style>

     CLUSTER COLOR THEMES (NIGHT RED/GREEN, DAYLIGHT WHITE, AMBER, CYAN)

    --tacho-track-bg: rgba(255, 255, 255, 0.04);

  /* 80s Synth Ice-Cyan VFD Theme */
  body[data-color="cyan"] {

  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 22%, #171b24 0%, #090b10 58%, #030406 100%);
    color: #e2e8f0;
    font-family: 'Chakra Petch', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 16px 28px;
    overflow-x: hidden;
    user-select: none;
  }

  .cockpit-stage {
    width: 100%;
    max-width: 1040px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ==========================================================================
     OUTER DASHBOARD HOOD BINNACLE
  ========================================================================== */
  .cluster-binnacle {
    width: 100%;
    background:
      radial-gradient(ellipse 85% 45% at 50% 0%, rgba(255, 70, 20, 0.09), transparent 65%),
      linear-gradient(180deg, #1d2027 0%, #0f1116 48%, #07080b 100%);
    border: 4px solid #262b34;
    border-radius: 26px 26px 18px 18px;
    padding: 18px 22px 14px;
    box-shadow:
      0 35px 85px rgba(0, 0, 0, 0.96),
      inset 0 2px 3px rgba(255, 255, 255, 0.12),
      inset 0 -8px 20px rgba(0, 0, 0, 0.9),
      0 0 0 2px #040507;
    position: relative;
    overflow: hidden;
  }

  .hood-glare {
    position: absolute;
    top: 2px;
    left: 26%;
    width: 48%;
    height: 14px;
    background: linear-gradient(90deg, transparent, rgba(255, 160, 40, 0.24), rgba(50, 255, 180, 0.16), rgba(255, 50, 20, 0.24), transparent);
    filter: blur(8px);
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  body[data-color="day-white"] .hood-glare {
    opacity: 0.12;
  }

  /* Smoked Acrylic Faceplate */
  .cluster-screen {
    background:
      radial-gradient(circle at 50% 45%, #0c0e13 0%, #050608 72%, #020304 100%);
    border: 2.5px solid #1a1e26;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 0 55px rgba(0, 0, 0, 0.98),
      inset 0 3px 12px rgba(0, 0, 0, 0.9);
  }

  /* Subtle VFD Phosphor Scanlines */
  .cluster-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.24) 0px 1.5px, transparent 1.5px 3.5px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0px 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 12;
  }

  .instrument-face {
    position: relative;
    width: 100%;
    aspect-ratio: 1000 / 445;
    min-height: 375px;
  }

  /* ==========================================================================
     UNIFIED MATHEMATICAL SVG LAYER (PARABOLIC TACHO + UNBROKEN RAYS)
  ========================================================================== */
  .cluster-architecture-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  .arch-line {
    stroke: var(--grid-line);
    stroke-width: 2.1;
    stroke-linecap: square;
    stroke-linejoin: miter;
    fill: none;
    filter: drop-shadow(0 0 4px var(--grid-glow));
    transition: stroke 0.3s ease, filter 0.3s ease;
  }

  .arch-line-ray {
    stroke: var(--grid-line);
    stroke-width: 1.7;
    stroke-linecap: butt;
    fill: none;
    filter: drop-shadow(0 0 3.5px var(--grid-glow));
    transition: stroke 0.3s ease, filter 0.3s ease;
  }

  .tacho-spine-rail {
    stroke: var(--tacho-track-border);
    stroke-width: 1.4;
    fill: var(--tacho-track-bg);
    transition: stroke 0.3s ease, fill 0.3s ease;
  }

  .arch-text {
    fill: var(--label-color);
    font-family: 'Orbitron', 'Chakra Petch', sans-serif;
    font-weight: 800;
    letter-spacing: 0.08em;
    filter: drop-shadow(0 0 5px var(--label-glow));
    transition: fill 0.3s ease, filter 0.3s ease;
  }

  /* Bold 0..8 Tachometer Numerals */
  .tacho-num-svg {
    fill: var(--num-color);
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    text-anchor: middle;
    dominant-baseline: central;
    filter: drop-shadow(0 0 6px var(--label-glow));
    transition: fill 0.3s ease;
  }

  /* Upper Fine Comb Scale Ticks (65 ticks along curve) */
  .tacho-fine-tick {
    stroke: var(--fine-tick-color);
    stroke-width: 2.2;
    stroke-linecap: butt;
    filter: drop-shadow(0 0 3px var(--label-glow));
    transition: stroke 0.3s ease;
  }
  .tacho-fine-tick.major-tick {
    stroke-width: 3.2;
  }
  .tacho-fine-tick.warnzone {
    stroke: var(--fine-tick-warn);
  }
  .tacho-fine-tick.redzone {
    stroke: var(--fine-tick-red);
  }

  /* Main 56 VFD Tachometer Segments (Bricks along the parabola) */
  .tacho-seg-poly {
    fill: var(--tacho-seg-off);
    stroke: rgba(0, 0, 0, 0.55);
    stroke-width: 0.8;
    transition: fill 0.04s ease, filter 0.04s ease;
  }

  .tacho-seg-poly.lit {
    fill: var(--tacho-seg-lit);
    filter: drop-shadow(0 0 8px var(--tacho-seg-glow));
  }

  .tacho-seg-poly.midrange.lit {
    fill: var(--tacho-seg-mid);
    filter: drop-shadow(0 0 8px var(--tacho-seg-glow));
  }

  .tacho-seg-poly.redline.lit {
    fill: var(--tacho-seg-red);
    filter: drop-shadow(0 0 11px #ff2a1a);
  }

  /* Peak-Hold Floating VFD Segment */
  .tacho-seg-poly.peak-hold {
    fill: #ffffff;
    filter: drop-shadow(0 0 10px #ffffff);
  }

  /* ==========================================================================
     TOP WARNING TELLTALE LAMPS (DOOR, TURN SIGNALS)
  ========================================================================== */
  .tell-tale-layer {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }

  .door-ajar-lamp {
    position: absolute;
    left: 17.8%;
    top: 7.2%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: #ff2e2e;
    opacity: 0.18;
    transition: opacity 0.2s ease, filter 0.2s ease;
    pointer-events: auto;
    cursor: pointer;
  }
  .door-ajar-lamp.active {
    opacity: 1;
    filter: drop-shadow(0 0 8px #ff2e2e);
  }
  .door-ajar-lamp span {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }

  .turn-lamp {
    position: absolute;
    top: 9.2%;
    width: 24px;
    height: 17px;
    color: #22c55e;
    opacity: 0.15;
    transition: opacity 0.1s ease, filter 0.1s ease;
    pointer-events: auto;
    cursor: pointer;
  }
  .turn-lamp.left { left: 25.4%; }
  .turn-lamp.right { right: 16.8%; }
  .turn-lamp.blinking {
    opacity: 1;
    filter: drop-shadow(0 0 10px #22c55e);
  }

  /* ==========================================================================
     LEFT VERTICAL FUEL BARGRAPH WINDOW
  ========================================================================== */
  .fuel-well-box {
    position: absolute;
    left: 2.6%;
    top: 30.5%;
    width: 8.8%;
    height: 44.5%;
    background: #030506;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.95);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
  }

  .vertical-vfd-ladder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 5px;
  }

  .vfd-scale-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: var(--vfd-primary);
    text-shadow: 0 0 6px var(--vfd-glow);
    padding: 1px 0;
  }

  .vfd-tube-frame {
    width: 30px;
    height: 100%;
    border: 2px solid var(--vfd-primary);
    box-shadow: 0 0 7px var(--vfd-glow), inset 0 0 5px rgba(0,0,0,0.9);
    padding: 2px;
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
  }

  .vfd-bar-seg {
    flex: 1;
    background: var(--vfd-ghost);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .vfd-bar-seg.lit {
    background: var(--vfd-primary);
    box-shadow: 0 0 8px var(--vfd-glow);
  }
  .vfd-bar-seg.warn-low.lit {
    background: #ff3b2f;
    box-shadow: 0 0 10px #ff3b2f;
  }

  /* ==========================================================================
     RECESSED DIGITAL SPEEDOMETER WINDOW ("ELECTRONIC DISPLAY")
  ========================================================================== */
  .speed-well-frame {
    position: absolute;
    left: 48.5%;
    top: 47.8%;
    width: 28.2%;
    height: 24.8%;
    background: #020404;
    border: 2px solid #12181f;
    box-shadow:
      inset 0 6px 18px rgba(0, 0, 0, 1),
      inset 0 0 30px rgba(0, 0, 0, 0.95);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 8px 22px;
  }

  .speed-vfd-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .speed-digits-stack {
    display: grid;
    place-items: end;
    font-family: 'DSEG7-Classic', monospace;
    font-size: clamp(38px, 5.4vw, 58px);
    line-height: 1;
    font-style: italic;
  }
  .speed-digits-stack > * { grid-area: 1 / 1; }

  .speed-ghost {
    color: var(--vfd-ghost);
    user-select: none;
  }

  .speed-lit {
    color: var(--vfd-primary);
    text-shadow:
      0 0 12px var(--vfd-glow),
      0 0 26px var(--vfd-glow);
    transition: color 0.25s ease, text-shadow 0.25s ease;
  }

  .speed-unit-vfd {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 800;
    color: var(--vfd-primary);
    text-shadow: 0 0 8px var(--vfd-glow);
    letter-spacing: 0.04em;
  }

  /* Red Warning Bar above "SPEED" label */
  .speed-over-indicator {
    position: absolute;
    left: 40.5%;
    top: 50.2%;
    width: 3.8%;
    height: 2.8%;
    background: #331010;
    border: 1px solid #591c1c;
    border-radius: 2px;
    z-index: 6;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .speed-over-indicator.chime-active {
    background: #ff2a1a;
    border-color: #ff8075;
    box-shadow: 0 0 12px #ff2a1a, 0 0 22px #ff2a1a;
    animation: chimePulse 0.42s infinite alternate;
  }
  @keyframes chimePulse {
    from { opacity: 0.55; }
    to { opacity: 1; }
  }

  /* ==========================================================================
     RIGHT VERTICAL COOLANT TEMP BARGRAPH WINDOW
  ========================================================================== */
  .temp-well-box {
    position: absolute;
    right: 2.6%;
    top: 30.5%;
    width: 8.8%;
    height: 44.5%;
    background: #030506;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.95);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
  }

  .temp-tube-frame {
    width: 30px;
    height: 100%;
    border: 2px solid var(--vfd-primary);
    box-shadow: 0 0 7px var(--vfd-glow), inset 0 0 5px rgba(0,0,0,0.9);
    padding: 3px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .temp-indicator-bar {
    width: 100%;
    height: 14%;
    background: var(--vfd-primary);
    box-shadow: 0 0 8px var(--vfd-glow);
  }

  /* ==========================================================================
     LOWER MECHANICAL CONTROL STRIP (ODOMETERS, KNOBS, BRAKE)
  ========================================================================== */
  .lower-mechanical-strip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18.5%;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 9% 0 15.5%;
  }

  .stem-control-group {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .physical-stem-knob {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #525866 0%, #232730 55%, #0c0e12 100%);
    border: 2px solid #383e4c;
    box-shadow:
      0 4px 8px rgba(0, 0, 0, 0.9),
      inset 0 1px 1px rgba(255, 255, 255, 0.28);
    cursor: pointer;
    position: relative;
    transition: transform 0.1s ease;
  }
  .physical-stem-knob::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 60% 60%, #1c2028, #090b0e);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .physical-stem-knob:active,
  .physical-stem-knob.pressed {
    transform: scale(0.9) translateY(2px);
  }

  .scale-change-label {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--label-color);
    filter: drop-shadow(0 0 4px var(--label-glow));
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 800;
    line-height: 1.1;
    cursor: pointer;
  }

  .mechanical-odo-window {
    background: #040507;
    border: 2px solid #1c2029;
    border-radius: 3px;
    padding: 2px 7px;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.98);
    display: flex;
    align-items: center;
    gap: 3px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--odo-digit-color);
    text-shadow: 0 0 5px var(--label-glow);
  }

  .trip-tenth-wheel {
    background: var(--odo-tenth-bg);
    color: var(--odo-tenth-fg);
    padding: 0 3px;
    border-radius: 2px;
    letter-spacing: 0;
    font-weight: 900;
    text-shadow: none;
  }

  .brake-warning-lamp {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    color: #ff2a1a;
    opacity: 0.22;
    cursor: pointer;
    transition: opacity 0.2s ease, filter 0.2s ease;
  }
  .brake-warning-lamp.active {
    opacity: 1;
    filter: drop-shadow(0 0 8px #ff2a1a) drop-shadow(0 0 16px #ff2a1a);
  }
  .brake-icon-ring {
    font-family: 'Orbitron', sans-serif;

<script>
  // ==========================================================================
  // 1. UNIFIED PARABOLIC TACHOMETER CURVE & PERSPECTIVE RAYS GENERATOR
  //    Reads native SVG namespaceURI directly from #clusterSvg (zero URL strings!)
  // ==========================================================================
  const SVG_NS = document.getElementById("clusterSvg").namespaceURI;
  const raysGroup = document.getElementById("parabolicRaysGroup");
  const tachoGroup = document.getElementById("parabolicTachoGroup");

  const X_START = 190;
  const X_SPAN  = 588; // Ends at x = 778
  const Y_SHELF = 132; // Flat top shelf height (around 5..8 RPM)
  const Y_DROP  = 186; // Vertical drop down to 0 RPM (y = 318)
  const EXP_POW = 2.55;

  // Exact point on the bottom spine of the tachometer bar for u in [0..8]
  function getCurvePoint(u) {
    const t = Math.max(0, Math.min(1, u / 8));
    const tx = Math.pow(t, 0.92);
    const x = X_START + X_SPAN * tx;
    const y = Y_SHELF + Y_DROP * Math.pow(1 - t, EXP_POW);
    return { x, y };
  }

  // Exact unit normal vector pointing UP-LEFT (perpendicular to curve)
  function getCurveNormal(u) {
    const du = 0.02;
    const p1 = getCurvePoint(Math.max(0, u - du));
    const p2 = getCurvePoint(Math.min(8, u + du));
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy) || 1;
    return { nx: dy / len, ny: -dx / len, tx: dx / len, ty: dy / len };
  }

  const BAR_THICKNESS = 14; // Bold, unmistakable VFD brick height

  // --------------------------------------------------------------------------
  // A. Build Continuous Outer Housing Track around the 56 VFD Bricks
  // --------------------------------------------------------------------------
  const trackBottomPts = [];
  const trackTopPts = [];
  for (let s = 0; s <= 80; s++) {
    const u = (s / 80) * 8;
    const p = getCurvePoint(u);
    const n = getCurveNormal(u);
    trackBottomPts.push(`${(p.x - n.nx * 2).toFixed(1)},${(p.y - n.ny * 2).toFixed(1)}`);
    trackTopPts.unshift(`${(p.x + n.nx * (BAR_THICKNESS + 2)).toFixed(1)},${(p.y + n.ny * (BAR_THICKNESS + 2)).toFixed(1)}`);
  }
  const trackPoly = document.createElementNS(SVG_NS, "polygon");
  trackPoly.setAttribute("points", trackBottomPts.concat(trackTopPts).join(" "));
  trackPoly.setAttribute("class", "tacho-spine-rail");
  tachoGroup.appendChild(trackPoly);

  // --------------------------------------------------------------------------
  // B. Build Perspective Grid Lines Anchored Directly to Curve Points u = 0..8
  // --------------------------------------------------------------------------
  function addSvgLine(x1, y1, x2, y2, cls = "arch-line-ray") {
    const ln = document.createElementNS(SVG_NS, "line");
    ln.setAttribute("x1", x1.toFixed(1));
    ln.setAttribute("y1", y1.toFixed(1));
    ln.setAttribute("x2", x2.toFixed(1));
    ln.setAttribute("y2", y2.toFixed(1));
    ln.setAttribute("class", cls);
    raysGroup.appendChild(ln);
  }

  const p0 = getCurvePoint(0);
  const p1 = getCurvePoint(1);
  const p2 = getCurvePoint(2);
  const n1 = getCurveNormal(1);
  const n2 = getCurveNormal(2);

  // Leader 2 (Top horizontal from Fuel frame right corner (132,118) into u=2 outer comb)
  const p2Outer = { x: p2.x + n2.nx * 26, y: p2.y + n2.ny * 26 };
  addSvgLine(132, 118, p2Outer.x - 36, 118);
  addSvgLine(p2Outer.x - 36, 118, p2Outer.x, p2Outer.y);

  // Leader 1 (Middle horizontal from Fuel frame into u=1 outer comb)
  const p1Outer = { x: p1.x + n1.nx * 26, y: p1.y + n1.ny * 26 };
  addSvgLine(128, 184, p1Outer.x - 28, 184);
  addSvgLine(p1Outer.x - 28, 184, p1Outer.x, p1Outer.y);

  // Leader 0 (Bottom diagonal from Fuel frame into u=0 start of tacho)
  addSvgLine(124, 268, p0.x - 8, p0.y + 4);
  addSvgLine(p0.x, p0.y, p0.x + 36, 342);

  // Radial Perspective Lines for u = 1, 2, 3, 4, 5, 6, 7, 8
  for (let u = 1; u <= 8; u++) {
    const p = getCurvePoint(u);
    const n = getCurveNormal(u);

    // 1) Upper Perspective Ray (from above the numeral up to y = 70 ceiling)
    if (u >= 3) {
      const startUpX = p.x + n.nx * 54;
      const startUpY = p.y + n.ny * 54;
      const slopeX = (u - 8) * 3.2 - 6;
      addSvgLine(startUpX, startUpY, startUpX + slopeX, 70);
    }

    // 2) Lower Perspective Ray (from bottom edge of tacho brick down to Speed box or Baseline y=342)
    const botX = p.x - n.nx * 2;
    const botY = p.y - n.ny * 2;

    if (u === 1) {
      addSvgLine(botX, botY, botX + 64, 342);
    } else if (u === 2) {
      addSvgLine(botX, botY, botX + 68, 342);
    } else if (u === 3) {
      addSvgLine(botX, botY, botX + 74, 342);
    } else if (u >= 4 && u <= 8) {
      const dxToSpeed = (9 - u) * 3.5;
      const hitX = botX + dxToSpeed;
      addSvgLine(botX, botY, hitX, 198);

      if (u >= 5) {
        const exitX = hitX + 16;
        addSvgLine(exitX, 310, exitX + 6, 342);
      }
    }
  }

  // --------------------------------------------------------------------------
  // C. Build 56 High-Contrast VFD Tachometer Bricks along the Parabola
  // --------------------------------------------------------------------------
  const TOTAL_BRICKS = 56;
  const tachoBrickElements = [];

  for (let i = 0; i < TOTAL_BRICKS; i++) {
    const u0 = (i / TOTAL_BRICKS) * 8;
    const u1 = ((i + 0.74) / TOTAL_BRICKS) * 8;

    const pt0 = getCurvePoint(u0);
    const nm0 = getCurveNormal(u0);
    const pt1 = getCurvePoint(u1);
    const nm1 = getCurveNormal(u1);

    const x1 = pt0.x, y1 = pt0.y;
    const x2 = pt1.x, y2 = pt1.y;
    const x3 = pt1.x + nm1.nx * BAR_THICKNESS, y3 = pt1.y + nm1.ny * BAR_THICKNESS;
    const x4 = pt0.x + nm0.nx * BAR_THICKNESS, y4 = pt0.y + nm0.ny * BAR_THICKNESS;

    const brick = document.createElementNS(SVG_NS, "polygon");
    brick.setAttribute("points", `${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} ${x3.toFixed(1)},${y3.toFixed(1)} ${x4.toFixed(1)},${y4.toFixed(1)}`);

    const rpmVal = (u0 / 8) * 8000;
    let cls = "tacho-seg-poly";
    if (rpmVal >= 6600) cls += " redline";
    else if (rpmVal >= 4500) cls += " midrange";

    brick.setAttribute("class", cls);
    tachoGroup.appendChild(brick);
    tachoBrickElements.push(brick);
  }

  // --------------------------------------------------------------------------
  // D. Build 65 Fine Comb Scale Ticks + Bold 0..8 Numerals Above the Bricks
  // --------------------------------------------------------------------------
  const TOTAL_FINE_TICKS = 64;
  for (let k = 0; k <= TOTAL_FINE_TICKS; k++) {
    const u = (k / TOTAL_FINE_TICKS) * 8;
    const p = getCurvePoint(u);
    const n = getCurveNormal(u);
    const isMajor = k % 8 === 0;

    const innerDist = BAR_THICKNESS + 5;
    const outerDist = isMajor ? BAR_THICKNESS + 14 : BAR_THICKNESS + 10.5;

    const x1 = p.x + n.nx * innerDist;
    const y1 = p.y + n.ny * innerDist;
    const x2 = p.x + n.nx * outerDist;
    const y2 = p.y + n.ny * outerDist;

    const tick = document.createElementNS(SVG_NS, "line");
    tick.setAttribute("x1", x1.toFixed(1));
    tick.setAttribute("y1", y1.toFixed(1));
    tick.setAttribute("x2", x2.toFixed(1));
    tick.setAttribute("y2", y2.toFixed(1));

    let tickCls = "tacho-fine-tick";
    if (isMajor) tickCls += " major-tick";
    if (u >= 7.25) tickCls += " redzone";
    else if (u >= 6.5) tickCls += " warnzone";
    tick.setAttribute("class", tickCls);
    tachoGroup.appendChild(tick);

    // Render 0, 1, 2, 3, 4, 5, 6, 7, 8 Numerals
    if (isMajor) {
      const digit = k / 8;
      const numDist = BAR_THICKNESS + 29;
      const nx = p.x + n.nx * numDist;
      const ny = p.y + n.ny * numDist;

      const txt = document.createElementNS(SVG_NS, "text");
      txt.setAttribute("x", nx.toFixed(1));
      txt.setAttribute("y", ny.toFixed(1));
      txt.setAttribute("class", "tacho-num-svg");
      txt.textContent = digit;
      tachoGroup.appendChild(txt);
    }
  }

  // ==========================================================================
  // 2. VERTICAL FUEL BARGRAPH (10 VFD SEGMENTS + SCALE CHANGE ZOOM)
  // ==========================================================================
  const fuelTube = document.getElementById("fuelTube");
  const fuelSegments = [];
  for (let i = 0; i < 10; i++) {
    const seg = document.createElement("div");
    seg.className = "vfd-bar-seg" + (i === 0 ? " warn-low" : "");
    if (i < 3) seg.classList.add("lit");
    fuelTube.appendChild(seg);
    fuelSegments.push(seg);
  }

  let isFuelScaleZoomed = false;
  const scaleChangeBtn = document.getElementById("scaleChangeBtn");
  const scaleKnob = document.getElementById("scaleKnob");
  const fuelTopLabel = document.getElementById("fuelTopLabel");

  scaleChangeBtn.addEventListener("click", () => {
    isFuelScaleZoomed = !isFuelScaleZoomed;
    scaleKnob.classList.toggle("pressed", isFuelScaleZoomed);
    fuelTopLabel.textContent = isFuelScaleZoomed ? "1/4" : "F";
    const litCount = isFuelScaleZoomed ? 9 : 3;
    fuelSegments.forEach((s, idx) => s.classList.toggle("lit", idx < litCount));
  });

  // ==========================================================================
  // 3. WEB AUDIO API: 4A-GE 16V ENGINE SYNTH & 105 KM/H "KIN-KON" CHIME
  // ==========================================================================
  let audioCtx = null;
  let engineOsc1 = null;
  let engineOsc2 = null;
  let engineGain = null;
  let soundEnabled = true;
  let lastChimeTime = 0;

  function initEngineAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      engineOsc1 = audioCtx.createOscillator();
      engineOsc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      engineGain = audioCtx.createGain();

      engineOsc1.type = "sawtooth";
      engineOsc2.type = "triangle";
      filter.type = "lowpass";
      filter.frequency.value = 460;
      engineGain.gain.value = 0.0001;

      engineOsc1.connect(filter);
      engineOsc2.connect(filter);
      filter.connect(engineGain);
      engineGain.connect(audioCtx.destination);

      engineOsc1.start();
      engineOsc2.start();
    } catch (e) {}
  }

  function updateEngineSound(rpm, active) {
    if (!audioCtx || !soundEnabled) {
      if (engineGain && audioCtx) engineGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.05);
      return;
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    const baseFreq = 30 + (rpm / 8000) * 205;
    engineOsc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.03);
    engineOsc2.frequency.setTargetAtTime(baseFreq * 1.5, audioCtx.currentTime, 0.03);
    const targetVol = active ? 0.055 : 0.012;
    engineGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.05);
  }

  function playAe86Chime() {
    if (!soundEnabled) return;
    initEngineAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (now - lastChimeTime < 0.85) return;
    lastChimeTime = now;

    const playBell = (freq, startTime, duration) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.08, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    };

    playBell(830.6, now, 0.36);
    playBell(659.2, now + 0.24, 0.48);
  }

  // ==========================================================================
  // 4. DRIVING PHYSICS, PEAK-HOLD TACHO & CLUSTER RENDER LOOP
  // ==========================================================================
  const speedReadout = document.getElementById("speedReadout");
  const speedOverBar = document.getElementById("speedOverBar");
  const gearReadout = document.getElementById("gearReadout");
  const odoDisplay = document.getElementById("odoDisplay");
  const tripDisplay = document.getElementById("tripDisplay");

  let currentSpeed = 0;
  let currentRpm = 2850;
  let peakBrickIdx = 19;
  let odoKm = 146.9;
  let tripKm = 146.9;
  let isThrottling = false;
  let isTougeDemo = false;

  function renderClusterState(rpm, speed) {
    const activeBricks = Math.max(3, Math.round((rpm / 8000) * TOTAL_BRICKS));
    if (activeBricks - 1 >= peakBrickIdx) {
      peakBrickIdx = activeBricks - 1;
    } else {
      peakBrickIdx = Math.max(activeBricks - 1, peakBrickIdx - 0.18);
    }
    const roundedPeak = Math.round(peakBrickIdx);

    tachoBrickElements.forEach((brick, idx) => {
      brick.classList.toggle("lit", idx < activeBricks);
      brick.classList.toggle("peak-hold", idx === roundedPeak && roundedPeak > activeBricks);
    });

    const roundedSpeed = Math.round(speed);
    speedReadout.textContent = String(roundedSpeed).padStart(3, " ");

    const over105 = roundedSpeed >= 105;
    speedOverBar.classList.toggle("chime-active", over105);
    if (over105) playAe86Chime();

    let gear = "N";
    if (roundedSpeed > 0) {
      if (roundedSpeed < 38) gear = "1st";
      else if (roundedSpeed < 68) gear = "2nd";
      else if (roundedSpeed < 104) gear = "3rd";
      else if (roundedSpeed < 142) gear = "4th";
      else gear = "5th";
    }
    gearReadout.textContent = `GEAR: ${gear} (${Math.round(rpm)} RPM)`;

    odoDisplay.textContent = String(Math.floor(odoKm)).padStart(6, "0");
    const tripWhole = String(Math.floor(tripKm) % 1000).padStart(3, " ");
    const tripTenth = Math.floor((tripKm * 10) % 10);
    tripDisplay.innerHTML = `<span>${tripWhole}</span><span class="trip-tenth-wheel">${tripTenth}</span>`;
  }

  // Startup Sweep Animation (0 -> 8000 RPM -> 2850 RPM warm idle)
  let startupPhase = 0;
  const startupTimer = setInterval(() => {
    startupPhase += 0.08;
    if (startupPhase <= 1) {
      renderClusterState(startupPhase * 8000, Math.round(startupPhase * 180));
    } else if (startupPhase <= 2) {
      const back = 1 - (startupPhase - 1);
      renderClusterState(2850 + back * 5150, 0);
    } else {
      clearInterval(startupTimer);
    }
  }, 30);

  // Main 40ms Physics Loop
  setInterval(() => {
    if (startupPhase <= 2) return;

    if (isThrottling || isTougeDemo) {
      document.getElementById("brakeLamp").classList.remove("active");
      document.getElementById("doorLamp").classList.remove("active");

      const maxSpeed = 172;
      if (currentSpeed < maxSpeed) {
        currentSpeed += isTougeDemo ? 1.4 : 2.1;
      }

      const shiftPoints = [0, 38, 68, 104, 142, 188];
      let gIdx = 0;
      for (let i = 0; i < shiftPoints.length - 1; i++) {
        if (currentSpeed >= shiftPoints[i]) gIdx = i;
      }
      const gearMin = shiftPoints[gIdx];
      const gearMax = shiftPoints[gIdx + 1];
      const gearProgress = (currentSpeed - gearMin) / (gearMax - gearMin);
      currentRpm = 3800 + gearProgress * 4100;

      if (isTougeDemo && currentSpeed >= 154) {
        currentSpeed = 74;
      }
    } else {
      if (currentSpeed > 0) {
        currentSpeed = Math.max(0, currentSpeed - 1.5);
      }
      const targetIdle = currentSpeed > 0 ? 2200 + currentSpeed * 28 : 2850;
      currentRpm += (targetIdle - currentRpm) * 0.16;
    }

    if (currentSpeed > 0) {
      const deltaKm = (currentSpeed / 3600) * 0.45;
      odoKm += deltaKm;
      tripKm += deltaKm;
    }

    updateEngineSound(currentRpm, isThrottling || isTougeDemo);
    renderClusterState(currentRpm, currentSpeed);
  }, 40);

  // ==========================================================================
  // 5. INTERACTIVE CONTROLS & KEYBOARD BINDINGS
  // ==========================================================================
  const revBtn = document.getElementById("revBtn");
  const tougeDemoBtn = document.getElementById("tougeDemoBtn");

  function startThrottle() {
    initEngineAudio();
    isThrottling = true;
    revBtn.classList.add("pressed");
  }
  function stopThrottle() {
    isThrottling = false;
    revBtn.classList.remove("pressed");
  }

  revBtn.addEventListener("pointerdown", startThrottle);
  window.addEventListener("pointerup", stopThrottle);

  tougeDemoBtn.addEventListener("click", () => {
    initEngineAudio();
    isTougeDemo = !isTougeDemo;
    tougeDemoBtn.classList.toggle("toggled", isTougeDemo);
    tougeDemoBtn.textContent = isTougeDemo ? "⏹ STOP TOUGE DEMO" : "🏔 TOUGE RUN DEMO";
  });

  // Trip Reset Knob
  const tripResetKnob = document.getElementById("tripResetKnob");
  tripResetKnob.addEventListener("click", () => {
    tripResetKnob.classList.add("pressed");
    tripKm = 0.0;
    renderClusterState(currentRpm, currentSpeed);
    setTimeout(() => tripResetKnob.classList.remove("pressed"), 200);
  });

  // Telltale Clicks
  document.getElementById("doorLamp").addEventListener("click", (e) => e.currentTarget.classList.toggle("active"));
  document.getElementById("brakeLamp").addEventListener("click", (e) => e.currentTarget.classList.toggle("active"));

  let hazardInterval = null;
  function toggleTurnHazard() {
    const l = document.getElementById("turnLeft");
    const r = document.getElementById("turnRight");
    if (hazardInterval) {
      clearInterval(hazardInterval);
      hazardInterval = null;
      l.classList.remove("blinking");
      r.classList.remove("blinking");
    } else {
      hazardInterval = setInterval(() => {
        l.classList.toggle("blinking");
        r.classList.toggle("blinking");
      }, 420);
    }
  }
  document.getElementById("turnLeft").addEventListener("click", toggleTurnHazard);
  document.getElementById("turnRight").addEventListener("click", toggleTurnHazard);

  // Audio Toggle
  const audioToggleBtn = document.getElementById("audioToggleBtn");
  audioToggleBtn.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    audioToggleBtn.classList.toggle("toggled", soundEnabled);
    audioToggleBtn.textContent = soundEnabled ? "🔊 4A-GE + CHIME" : "🔇 AUDIO MUTED";
  });

  // Theme Presets
  const presetBtns = document.querySelectorAll(".preset-pill");
  presetBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      presetBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.body.dataset.color = btn.dataset.theme;
    });
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key.toLowerCase() === "w") {
      e.preventDefault();
      startThrottle();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space" || e.key.toLowerCase() === "w") {
      stopThrottle();
    }
  });
</script>

</body>
