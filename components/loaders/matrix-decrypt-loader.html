<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Cyberpunk Matrix Decrypt Loader — Terminal Buffer Hex Stream</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

<script type="application/json" data-uilab-meta>

  "techniques": [
    "Hexadecimal character scramble cycle with step-based glyph convergence",

    "Segmented ASCII progress rail filled via monospace block characters (█)",

  ],

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: #030804 radial-gradient(circle at 50% 50%, #07170a 0%, #020503 100%);
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    user-select: none;
    color: #22c55e;
  }

  .terminal-box {
    position: relative;
    width: 360px;
    background: rgba(4, 20, 8, 0.75);
    border: 1px solid #166534;
    border-radius: 8px;
    padding: 18px 22px;
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.9),
      0 0 20px rgba(34, 197, 94, 0.2),
      inset 0 0 15px rgba(34, 197, 94, 0.08);
    overflow: hidden;
  }

  /* CRT Scanlines */
  .terminal-box::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.3) 0px,
      rgba(0, 0, 0, 0.3) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  .term-header {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #4ade80;
    letter-spacing: 1.5px;
    border-bottom: 1px dashed #166534;
    padding-bottom: 8px;
    margin-bottom: 14px;
  }

  /* Memory Hex Dump */
  .hex-stream {
    font-size: 12px;
    line-height: 1.6;
    letter-spacing: 1px;
    margin-bottom: 14px;
    min-height: 80px;
  }
  .hex-row {
    display: flex;
    justify-content: space-between;
  }
  .hex-addr {
    color: #15803d;
  }
  .hex-bytes {
    color: #86efac;
    text-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
  }

  /* ASCII Segmented Rail */
  .progress-wrap {
    margin-top: 10px;
  }
  .progress-bar {
    font-size: 14px;
    letter-spacing: 2px;
    color: #22c55e;
    text-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
    white-space: pre;
    overflow: hidden;
  }

  .status-line {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-top: 8px;
    color: #4ade80;
  }

  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: #22c55e;
    vertical-align: middle;
    animation: blink 0.9s infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="terminal-box">
    <div class="term-header">
      <span>NET-DECRYPT // V.38</span>
      <span>BUFFER 0x7FF</span>
    </div>

    <div class="hex-stream" id="hex-stream">
      <div class="hex-row"><span class="hex-addr">0x00F4</span><span class="hex-bytes" id="r1">B7 4E 8A D1 C9 22</span></div>
      <div class="hex-row"><span class="hex-addr">0x00FC</span><span class="hex-bytes" id="r2">FA 10 9C 3E 44 88</span></div>
      <div class="hex-row"><span class="hex-addr">0x0104</span><span class="hex-bytes" id="r3">6B E2 71 A5 9F 04</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="prog-bar">[░░░░░░░░░░░░░░░░]</div>
      <div class="status-line">
        <span id="term-status">DECRYPTING KEYSTREAM...</span>
        <span id="term-pct">24%</span>
      </div>
    </div>
  </div>

<script>
(() => {
  const hexChars = "0123456789ABCDEF";
  const r1 = document.getElementById('r1');
  const r2 = document.getElementById('r2');
  const r3 = document.getElementById('r3');
  const progBar = document.getElementById('prog-bar');
  const termPct = document.getElementById('term-pct');
  const termStatus = document.getElementById('term-status');

  function randBytes() {
    let s = "";
    for (let i = 0; i < 6; i++) {
      s += hexChars[Math.floor(Math.random() * 16)] + hexChars[Math.floor(Math.random() * 16)] + " ";
    }
    return s.trim();
  }

  let progress = 24;
  const TOTAL_BLOCKS = 16;

  setInterval(() => {
    r1.textContent = randBytes();
    r2.textContent = randBytes();
    r3.textContent = randBytes();

    progress = (progress + 1) > 100 ? 5 : progress + 1;
    termPct.textContent = `${progress}%`;

    const filled = Math.floor((progress / 100) * TOTAL_BLOCKS);
    const empty = TOTAL_BLOCKS - filled;
    progBar.textContent = `[${"█".repeat(filled)}${"░".repeat(empty)}]`;

    if (progress > 90) {
      termStatus.textContent = "VERIFYING SIGNATURE...";
    } else if (progress > 60) {
      termStatus.textContent = "CRACKING SHA-512 HASH...";
    } else {
      termStatus.textContent = "DECRYPTING KEYSTREAM...";
    }
  }, 90);
})();
</script>
</body>
</html>
