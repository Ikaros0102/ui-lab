<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>UI LAB — Vector W8 Avionics Cockpit & Amber EL Display</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  :root {
    --leather-dark: #111215;
    --alu-base: #181920;
    --alu-dark: #101116;
    --el-amber: #ff9d1a;
    --el-amber-bright: #ffd066;
    --el-amber-glow: rgba(255, 157, 26, 0.72);
    --el-bg-dark: #1a0d02;
    --korry-orange: #ff7b29;
    --korry-amber: #ffae42;
    --warn-red: #ff2a1f;
    --silkscreen: #e2e6f0;
    --panel-brt: 1;
    --disp-brt: 1;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #1c1f29 0%, #090a0d 75%, #040406 100%);
    color: var(--silkscreen);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    overflow-x: hidden;
  }

  /* =========================================================
     STITCHED BLACK LEATHER DASHBOARD BINNACLE FRAME
     ========================================================= */
  .leather-dash-hood {
    width: 100%;
    max-width: 1360px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 60%),
      repeating-radial-gradient(circle at 25% 25%, rgba(255,255,255,0.012) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #22242b 0%, #131419 12%, #0d0e12 88%, #1a1c22 100%);
    border: 3px solid #282a33;
    border-radius: 26px 26px 18px 18px;
    padding: 24px 26px 26px;
    box-shadow:
      0 42px 95px rgba(0, 0, 0, 0.98),
      inset 0 3px 8px rgba(255, 255, 255, 0.12),
      inset 0 -8px 20px rgba(0, 0, 0, 0.95);
    position: relative;
  }

  /* Leather Seam Stitching Line Along Inner Rim */
  .leather-dash-hood::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1.5px dashed rgba(255, 255, 255, 0.14);
    border-radius: 18px 18px 12px 12px;
    pointer-events: none;
  }

  /* =========================================================
     MAIN 4-COLUMN AVIONICS PANEL GRID
     [1. LIGHTS] | [2. DIMMERS & CRUISE] | [3. EL SCREEN + LOWER HUD/WARN] | [4. CIRCUIT BREAKERS]
     ========================================================= */
  .avionics-bay {
    background: #08090c;
    border: 2px solid #040507;
    border-radius: 12px;
    padding: 8px;
    display: grid;
    grid-template-columns: 168px 188px 1fr 250px;
    gap: 7px;
    align-items: stretch;
    box-shadow: inset 0 0 30px #000;
  }

  /* Shared Brushed Black-Anodized Aluminum Plate */
  .anodized-plate {
    background:
      /* Fine vertical brushed aluminum grain */
      repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0px 1px, transparent 1px 2.5px),
      linear-gradient(180deg, #21232d 0%, #171820 50%, #12131a 100%);
    border: 1.5px solid #2b2e3b;
    border-radius: 5px;
    position: relative;
    padding: 16px 12px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 4px 12px rgba(0, 0, 0, 0.8);
  }

  /* Socket-Head Allen Machine Screws in Plate Corners */
  .allen-screw {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #525866 0%, #1e2028 65%, #090a0d 100%);
    border: 1px solid #090a0d;
    box-shadow: 0 1px 1px rgba(255,255,255,0.12), inset 0 1px 2px #000;
    pointer-events: none;
    z-index: 4;
  }
  .allen-screw::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: #08090c;
    clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  }
  .as-tl { top: 6px; left: 6px; }
  .as-tr { top: 6px; right: 6px; }
  .as-bl { bottom: 6px; left: 6px; }
  .as-br { bottom: 6px; right: 6px; }

  /* =========================================================
     MILITARY KORRY BACKLIT PUSH-BUTTON SWITCHES
     ========================================================= */
  .korry-switch {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    height: 60px;
    background: #0c0d12;
    border: 2px solid #2a2d38;
    border-radius: 5px;
    padding: 4px;
    box-shadow:
      0 4px 8px rgba(0, 0, 0, 0.85),
      inset 0 0 6px #000;
    display: flex;
    transition: transform 0.08s ease;
  }

  .korry-lens {
    flex: 1;
    background: radial-gradient(circle at 50% 50%, #2b2726 0%, #1a1819 75%, #121113 100%);
    border: 1px solid #3c3a3e;
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.15;
    color: rgba(255, 174, 66, calc(0.48 * var(--panel-brt)));
    transition: all 0.15s ease;
  }

  .korry-switch:hover .korry-lens {
    border-color: #635c56;
  }

  .korry-switch:active {
    transform: scale(0.96);
  }

  /* Active Illuminated Korry State */
  .korry-switch.lit .korry-lens {
    color: var(--korry-amber);
    text-shadow:
      0 0 6px rgba(255, 140, 30, var(--panel-brt)),
      0 0 14px rgba(255, 100, 0, var(--panel-brt));
    background: radial-gradient(circle at 50% 50%, rgba(85, 48, 22, 0.65) 0%, #1a1615 85%);
    border-color: rgba(255, 165, 70, 0.45);
  }

  .korry-switch.lit-red .korry-lens {
    color: #ff6b3d;
    text-shadow:
      0 0 8px rgba(255, 75, 30, var(--panel-brt)),
      0 0 16px rgba(255, 40, 0, var(--panel-brt));
    background: radial-gradient(circle at 50% 50%, rgba(110, 32, 18, 0.72) 0%, #1c1312 85%);
    border-color: rgba(255, 95, 50, 0.55);
  }

  .korry-ico {
    font-size: 14px;
    line-height: 1;
  }

  /* =========================================================
     PANEL 1 (FAR LEFT): LIGHTING & HAZARD KORRY SWITCHES
     ========================================================= */
  .panel-lights {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .lights-2col-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .hazard-wrap {
    padding: 0 16px;
    margin-top: 12px;
  }

  .hazard-wrap .korry-switch {
    width: 100%;
    height: 62px;
  }

  .hazard-tri {
    display: inline-block;
    margin-top: 3px;
    width: 18px;
    height: 16px;
    background: #d93829;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    position: relative;
    box-shadow: 0 0 10px #ff2a1f;
  }
  .hazard-tri::after {
    content: "";
    position: absolute;
    inset: 4px 4px 2px 4px;
    background: #1a1615;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }

  /* =========================================================
     PANEL 2: PWR, CLT FAN, THUMBWHEEL DIMMERS & CRUISE
     ========================================================= */
  .panel-dimmer-cruise {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .dimmers-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 6px 0;
  }

  .dimmer-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .panel-sec-title {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: var(--silkscreen);
    text-transform: uppercase;
  }

  .wheel-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .brt-dim-labels {
    height: 92px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 7.5px;
    font-weight: 800;
    color: #b0b8c9;
  }

  /* Notched Gear-Toothed Rotary Thumbwheel */
  .thumbwheel-slot {
    width: 28px;
    height: 96px;
    background: #07080b;
    border: 2px solid #2b2f3d;
    border-radius: 6px;
    padding: 4px 3px;
    box-shadow: inset 0 4px 10px #000;
    cursor: ns-resize;
    position: relative;
    overflow: hidden;
  }

  .thumbwheel-drum {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.85) 100%),
      repeating-linear-gradient(
        180deg,
        #323645 0px 5px,
        #12141c 5px 10px
      );
    background-position: 0 var(--wheel-pos, 0px);
    box-shadow: inset 0 0 6px rgba(255,255,255,0.15);
  }

  /* Cruise Control Section */
  .cruise-header-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .cruise-header-line::before,
  .cruise-header-line::after {
    content: "";
    flex: 1;
    height: 1.5px;
    background: var(--silkscreen);
  }

  /* =========================================================
     PANEL 3 (CENTER): AMBER EL SCREEN + LOWER HUD/BOOST/WARN
     ========================================================= */
  .center-stack {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* Upper Display Bezel */
  .el-display-housing {
    flex: 1;
    padding: 22px 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Recessed Electroluminescent (EL) Amber Flat-Panel Screen */
  .el-screen-frame {
    width: 100%;
    height: 286px;
    background:
      /* Fine EL pixel matrix grid */
      repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0px 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 50%, #3d2104 0%, #1f1002 65%, #0f0701 100%);
    border: 4px solid #090a0d;
    border-radius: 6px;
    box-shadow:
      inset 0 0 32px rgba(0, 0, 0, 0.95),
      inset 0 0 18px rgba(255, 145, 0, 0.25),
      0 1px 0 rgba(255, 255, 255, 0.12);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    opacity: var(--disp-brt);
    transition: opacity 0.15s ease;
  }

  /* Diagonal Glass Reflection Across EL Screen */
  .el-screen-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(255, 200, 120, 0.05) 0%, transparent 42%);
    pointer-events: none;
  }

  /* Top Screen Bar (`629 MILES` | `11:19`) */
  .el-top-bar {
    height: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--el-amber);
    text-shadow: 0 0 8px var(--el-amber-glow);
    border-bottom: 1.5px solid var(--el-amber);
  }

  /* Middle Screen Body: [Gear PRND21] + [Center Wireframe / Telemetry] + [Right Margin] */
  .el-middle-body {
    flex: 1;
    display: grid;
    grid-template-columns: 38px 1fr 28px;
    min-height: 0;
  }

  .el-gear-column {
    border-right: 1.5px solid var(--el-amber);
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    padding: 4px 0;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--el-amber);
    text-shadow: 0 0 8px var(--el-amber-glow);
  }

  .el-gear-item {
    width: 100%;
    text-align: center;
    padding: 2px 0;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .el-gear-item.active {
    background: var(--el-amber);
    color: #1a0d02;
    text-shadow: none;
    box-shadow: 0 0 12px var(--el-amber-glow);
  }

  .el-canvas-viewport {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    cursor: pointer;
  }

  .el-right-margin {
    border-left: 1.5px solid var(--el-amber);
  }

  /* Bottom 4 Soft-Key Tabs (`1 MAIN`, `2 PERFORMANCE`, `3 PERFORMANCE`, `4 CHASSIS`) */
  .el-bottom-tabs {
    height: 26px;
    border-top: 1.5px solid var(--el-amber);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .el-tab-cell {
    border-right: 1.5px solid var(--el-amber);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: var(--el-amber);
    text-shadow: 0 0 6px var(--el-amber-glow);
    cursor: pointer;
    padding-left: 12px;
  }
  .el-tab-cell:last-child { border-right: none; }

  .el-tab-cell.active {
    background: rgba(255, 157, 26, 0.22);
    color: var(--el-amber-bright);
  }

  /* Corner Triangle Number Tag Inside Each Tab (`◢1`) */
  .tab-corner-num {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    background: var(--el-amber);
    color: #1a0d02;
    font-size: 9px;
    font-weight: 800;
    text-shadow: none;
    clip-path: polygon(0 100%, 100% 0, 100% 100%);
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0 2px 1px 0;
  }

  /* =========================================================
     PANEL 4 (CENTER LOWER STRIP): HUD, BOOST, WARNINGS & HOBBS
     ========================================================= */
  .lower-instrument-strip {
    height: 108px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  /* HUD & BOOST Rotary Knobs */
  .hud-knob-group, .boost-knob-group {
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .hud-scale-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 62px;
    font-size: 8px;
    font-weight: 800;
    text-align: right;
  }

  .avionics-knob {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background:
      repeating-conic-gradient(#12131a 0deg 15deg, #282b38 15deg 30deg);
    border: 2px solid #090a0d;
    box-shadow: 0 5px 10px rgba(0,0,0,0.85), inset 0 1px 1px rgba(255,255,255,0.2);
    position: relative;
    cursor: ns-resize;
    transform: rotate(var(--k-deg, 0deg));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avionics-knob-cap {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #383c4d, #161820);
    border: 1px solid #090a0d;
  }

  .avionics-knob::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 2.5px;
    height: 12px;
    background: #ffffff;
    border-radius: 1px;
  }

  /* 2x3 Warning Annunciator Matrix */
  .warning-6-grid {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(2, 34px);
    gap: 4px;
    background: #08090c;
    padding: 4px;
    border: 1.5px solid #2b2e3b;
    border-radius: 4px;
  }

  .annunciator-cell {
    background: #1a1b22;
    border: 1px solid #2e313d;
    border-radius: 2px;
    font-size: 7.5px;
    font-weight: 800;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    color: rgba(255, 255, 255, 0.72);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .annunciator-cell.red-active {
    background: radial-gradient(circle, #ff4d3d 0%, #c91e12 85%);
    border-color: #ff948a;
    color: #ffffff;
    text-shadow: 0 0 6px #ffffff;
    box-shadow: 0 0 14px rgba(255, 42, 31, 0.85);
  }

  .annunciator-cell.amber-active {
    background: radial-gradient(circle, #ffb838 0%, #c77700 85%);
    border-color: #ffe099;
    color: #1a0d02;
    box-shadow: 0 0 12px rgba(255, 174, 66, 0.75);
  }

  /* Hobbs Mechanical Quartz Engine Hour Meter */
  .hobbs-meter-box {
    width: 82px;
    height: 54px;
    background: #090a0d;
    border: 2px solid #2c303d;
    border-radius: 4px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 2px 6px #000;
  }

  .hobbs-brand-top {
    font-size: 6.5px;
    font-weight: 800;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
  }

  .hobbs-drums-row {
    display: flex;
    gap: 1.5px;
    background: #000;
    padding: 2px;
    border: 1px solid #333846;
  }

  .h-drum {
    flex: 1;
    background: #14161d;
    color: #f8fafc;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
  }

  .h-drum.tenth {
    background: #e2e8f0;
    color: #090a0d;
  }

  .hobbs-foot {
    font-size: 6.5px;
    font-weight: 800;
    color: #cbd5e1;
    display: flex;
    justify-content: space-between;
  }

  /* =========================================================
     PANEL 5 (FAR RIGHT): 3x5 AIRCRAFT KLIXON CIRCUIT BREAKERS
     ========================================================= */
  .panel-breakers {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px 14px;
  }

  .breakers-grid {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px 6px;
    align-items: center;
    justify-items: center;
  }

  .breaker-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .breaker-collar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: conic-gradient(#475569, #1e293b, #64748b, #0f172a, #475569);
    border: 1.5px solid #090a0d;
    box-shadow: 0 4px 7px rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.15s ease;
  }

  /* Popped-out white trip band when breaker is pulled/tripped */
  .breaker-unit.tripped .breaker-collar {
    box-shadow: 0 0 0 2.5px #f8fafc, 0 6px 12px #000;
    transform: scale(1.08);
  }

  .breaker-cap {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2e3240 0%, #12141c 75%);
    border: 1px solid #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    color: #e2e8f0;
  }

  .breaker-lbl {
    font-size: 6.5px;
    font-weight: 800;
    color: var(--silkscreen);
    letter-spacing: 0.3px;
    text-align: center;
    white-space: nowrap;
  }

  @media (max-width: 1340px) {
    .leather-dash-hood {
      transform: scale(0.76);
      transform-origin: top center;
    }
  }
</style>
</head>
<body>

<main class="leather-dash-hood">

  <section class="avionics-bay">

    <!-- =======================================================
         PANEL 1 (FAR LEFT): LIGHTING & HAZARD KORRY SWITCHES
         ======================================================= -->
    <aside class="anodized-plate panel-lights">
      <div class="allen-screw as-tl"></div>
      <div class="allen-screw as-tr"></div>
      <div class="allen-screw as-bl"></div>
      <div class="allen-screw as-br"></div>

      <div class="lights-2col-grid">
        <button class="korry-switch lit">
          <div class="korry-lens">
            <span>PARK</span>
            <span class="korry-ico">P≡</span>
          </div>
        </button>

        <button class="korry-switch lit">
          <div class="korry-lens">
            <span>HEAD</span>
            <span class="korry-ico">≡D</span>
          </div>
        </button>

        <button class="korry-switch lit">
          <div class="korry-lens">
            <span>FOG</span>
            <span class="korry-ico">‡D</span>
          </div>
        </button>

        <button class="korry-switch lit">
          <div class="korry-lens">
            <span>DRIVE</span>
          </div>
        </button>

        <button class="korry-switch">
          <div class="korry-lens">
            <span>INT</span>
          </div>
        </button>

        <button class="korry-switch">
          <div class="korry-lens">
            <span>AUX</span>
          </div>
        </button>
      </div>

      <div class="hazard-wrap">
        <button class="korry-switch" id="hazardBtn">
          <div class="korry-lens">
            <span style="color:#f8fafc;">HAZARD</span>
            <span class="hazard-tri"></span>
          </div>
        </button>
      </div>
    </aside>

    <!-- =======================================================
         PANEL 2: PWR, CLT FAN, THUMBWHEEL DIMMERS & CRUISE
         ======================================================= -->
    <aside class="anodized-plate panel-dimmer-cruise">
      <div class="allen-screw as-tl"></div>
      <div class="allen-screw as-tr"></div>
      <div class="allen-screw as-bl"></div>
      <div class="allen-screw as-br"></div>

      <!-- Top Row: PWR & CLT FAN MAN -->
      <div class="lights-2col-grid">
        <button class="korry-switch lit">
          <div class="korry-lens"><span>PWR</span></div>
        </button>
        <button class="korry-switch lit-red">
          <div class="korry-lens"><span>CLT<br>FAN<br>MAN</span></div>
        </button>
      </div>

      <!-- Middle Row: PANEL & DISPLAY Vertical Thumbwheel Dimmers -->
      <div class="dimmers-section">
        <div class="dimmer-col">
          <span class="panel-sec-title">PANEL</span>
          <div class="wheel-row">
            <div class="brt-dim-labels"><span>BRT</span><span>DIM</span></div>
            <div class="thumbwheel-slot" data-wheel="panel" title="Drag vertically to dim Panel Switches">
              <div class="thumbwheel-drum"></div>
            </div>
          </div>
        </div>

        <div class="dimmer-col">
          <span class="panel-sec-title">DISPLAY</span>
          <div class="wheel-row">
            <div class="brt-dim-labels"><span>BRT</span><span>DIM</span></div>
            <div class="thumbwheel-slot" data-wheel="display" title="Drag vertically to dim Amber EL Screen">
              <div class="thumbwheel-drum"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Row: CRUISE 2x2 Switches -->
      <div>
        <div class="cruise-header-line">
          <span class="panel-sec-title">CRUISE</span>
        </div>
        <div class="lights-2col-grid">
          <button class="korry-switch">
            <div class="korry-lens"><span>ENABLE</span></div>
          </button>
          <button class="korry-switch">
            <div class="korry-lens"><span>INHIBIT</span></div>
          </button>
          <button class="korry-switch">
            <div class="korry-lens"><span>ENGAGE<br>UP</span></div>
          </button>
          <button class="korry-switch">
            <div class="korry-lens"><span>ENGAGE<br>DOWN</span></div>
          </button>
        </div>
      </div>
    </aside>

    <!-- =======================================================
         PANEL 3 & 4 (CENTER): AMBER EL SCREEN + LOWER HUD/WARN
         ======================================================= -->
    <div class="center-stack">

      <!-- Upper Amber Electroluminescent (EL) Display Unit -->
      <section class="anodized-plate el-display-housing">
        <div class="allen-screw as-tl"></div>
        <div class="allen-screw as-tr"></div>
        <div class="allen-screw as-bl"></div>
        <div class="allen-screw as-br"></div>

        <div class="el-screen-frame">
          <!-- Top Status Bar -->
          <div class="el-top-bar">
            <span id="elMilesReadout">629 MILES</span>
            <span id="elClockReadout">11:19</span>
          </div>

          <!-- Middle Body: PRND21 Column + Wireframe / Telemetry Viewport -->
          <div class="el-middle-body">
            <div class="el-gear-column" id="gearCol">
              <div class="el-gear-item active" data-g="P">P</div>
              <div class="el-gear-item" data-g="R">R</div>
              <div class="el-gear-item" data-g="N">N</div>
              <div class="el-gear-item" data-g="D">D</div>
              <div class="el-gear-item" data-g="2">2</div>
              <div class="el-gear-item" data-g="1">1</div>
            </div>

            <div class="el-canvas-viewport" id="elViewport" title="Click wireframe to toggle Scissor Door & Engine Canopy">
              <!-- Dynamic SVG rendered by JS (Chassis Wireframe or Twin-Turbo Performance Gauges) -->
            </div>

            <div class="el-right-margin"></div>
          </div>

          <!-- Bottom 4 Soft-Key Tabs -->
          <div class="el-bottom-tabs" id="elTabs">
            <div class="el-tab-cell active" data-tab="main">
              <span class="tab-corner-num">1</span>
              <span>MAIN</span>
            </div>
            <div class="el-tab-cell" data-tab="perf1">
              <span class="tab-corner-num">2</span>
              <span>PERFORMANCE</span>
            </div>
            <div class="el-tab-cell" data-tab="perf2">
              <span class="tab-corner-num">3</span>
              <span>PERFORMANCE</span>
            </div>
            <div class="el-tab-cell" data-tab="chassis">
              <span class="tab-corner-num">4</span>
              <span>CHASSIS</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Lower Strip: HUD Knob + BOOST Knob + 6 Warning Lamps + Hobbs Meter -->
      <section class="anodized-plate lower-instrument-strip">
        <div class="allen-screw as-tl"></div>
        <div class="allen-screw as-tr"></div>
        <div class="allen-screw as-bl"></div>
        <div class="allen-screw as-br"></div>

        <!-- HUD Rotary Knob -->
        <div class="hud-knob-group">
          <span class="panel-sec-title">HUD</span>
          <div class="hud-scale-labels">
            <span>BRT─</span>
            <span>DIM─</span>
            <span>OFF─</span>
          </div>
          <div class="avionics-knob" data-knob="hud" style="--k-deg: 35deg;">
            <div class="avionics-knob-cap"></div>
          </div>
        </div>

        <!-- BOOST Rotary Knob -->
        <div class="boost-knob-group" style="flex-direction:column;gap:3px;">
          <span class="panel-sec-title">BOOST</span>
          <div style="display:flex;align-items:flex-end;gap:4px;">
            <span style="font-size:7px;font-weight:800;">MIN</span>
            <div class="avionics-knob" id="boostKnob" data-knob="boost" style="--k-deg: 10deg;">
              <div class="avionics-knob-cap"></div>
            </div>
            <span style="font-size:7px;font-weight:800;">MAX</span>
          </div>
        </div>

        <!-- 2x3 Warning Annunciator Matrix -->
        <div class="warning-6-grid" id="warnGrid">
          <div class="annunciator-cell">AIR BAG</div>
          <div class="annunciator-cell red-active" id="brakeWarnCell">BRAKE</div>
          <div class="annunciator-cell">FAN INOP</div>
          <div class="annunciator-cell">LOW<br>COOLANT</div>
          <div class="annunciator-cell">LOW<br>TRANS</div>
          <div class="annunciator-cell">LOW<br>OIL</div>
        </div>

        <!-- Hobbs Quartz Mechanical Hour Meter -->
        <div class="hobbs-meter-box">
          <div class="hobbs-brand-top">
            <i>Hobbs</i>
            <span>QUARTZ</span>
          </div>
          <div class="hobbs-drums-row">
            <span class="h-drum">0</span>
            <span class="h-drum">0</span>
            <span class="h-drum">2</span>
            <span class="h-drum">6</span>
            <span class="h-drum" id="hobbsTenth">4</span>
            <span class="h-drum tenth">8</span>
          </div>
          <div class="hobbs-foot">
            <span>⏳ HOURS</span>
            <span>1/10</span>
          </div>
        </div>

      </section>

    </div>

    <!-- =======================================================
         PANEL 5 (FAR RIGHT): 3x5 AIRCRAFT CIRCUIT BREAKERS
         ======================================================= -->
    <aside class="anodized-plate panel-breakers">
      <div class="allen-screw as-tl"></div>
      <div class="allen-screw as-tr"></div>
      <div class="allen-screw as-bl"></div>
      <div class="allen-screw as-br"></div>

      <div class="breakers-grid" id="breakersGrid">
        <!-- Populated by JS: 15 Aircraft Thermal Push-Pull Breakers -->
      </div>
    </aside>

  </section>

</main>

<script>
(() => {
  // =========================================================================
  // 1. POPULATE 3x5 AIRCRAFT KLIXON CIRCUIT BREAKERS PANEL
  // =========================================================================
  const BREAKERS = [
    { amp: 20, lbl: 'ENGINE' },    { amp: 15, lbl: 'INST' },    { amp: 30, lbl: 'DEFROST' },
    { amp: 20, lbl: 'FUEL PUMP' }, { amp: 20, lbl: 'AUX FAN' }, { amp: 15, lbl: 'WIPER' },
    { amp: 25, lbl: 'LIGHTS' },    { amp: 30, lbl: 'CLT FAN' }, { amp: 20, lbl: 'SEATS' },
    { amp: 15, lbl: 'BRAKE LGT' }, { amp: 30, lbl: 'HVAC' },    { amp: 15, lbl: 'HAZARD' },
    { amp: 20, lbl: 'DOOR LCK' },  { amp: 5,  lbl: 'AIR BAG' }, { amp: 10, lbl: 'ALT' }
  ];

  const breakersGrid = document.getElementById('breakersGrid');
  breakersGrid.innerHTML = BREAKERS.map(b => `
    <div class="breaker-unit" title="Click to Pull / Reset ${b.lbl} Circuit Breaker (${b.amp}A)">
      <div class="breaker-collar">
        <div class="breaker-cap">${b.amp}</div>
      </div>
      <span class="breaker-lbl">${b.lbl}</span>
    </div>
  `).join('');

  breakersGrid.querySelectorAll('.breaker-unit').forEach(unit => {
    unit.addEventListener('click', () => unit.classList.toggle('tripped'));
  });

  // =========================================================================
  // 2. AMBER EL DISPLAY: VECTOR W8 WIREFRAME & PERFORMANCE TELEMETRY PAGES
  // =========================================================================
  const elViewport = document.getElementById('elViewport');
  let activeTab = 'main';
  let doorOpen = true;
  let canopyOpen = true;
  let boostPsi = 12.4;

  // Exact Vector W8 Wedge Supercar Side-Profile Wireframe with Open Scissor Door & Rear Canopy!
  function getVectorW8WireframeSvg() {
    const stroke = 'stroke="#ff9d1a" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"';
    const glowFilter = 'style="filter: drop-shadow(0 0 6px rgba(255, 157, 26, 0.7));"';

    const scissorDoorMarkup = doorOpen ? `
      <!-- Raised Scissor / Gullwing Door (Exact match to photo!) -->
      <g>
        <polygon points="155,95 215,18 258,42 222,102" ${stroke} fill="rgba(26, 13, 2, 0.85)"/>
        <polygon points="166,90 212,28 246,46 215,96" ${stroke}/>
        <line x1="185" y1="95" x2="215" y2="55" ${stroke}/>
      </g>
    ` : `
      <!-- Closed Scissor Door -->
      <polygon points="155,95 232,76 265,98 255,134 155,134" ${stroke}/>
    `;

    const rearCanopyMarkup = canopyOpen ? `
      <!-- Open Rear Engine Bay Louvered Canopy -->
      <line x1="285" y1="92" x2="342" y2="54" stroke="#ff9d1a" stroke-width="2.4"/>
      <line x1="305" y1="96" x2="322" y2="68" ${stroke}/>
    ` : '';

    return `
      <svg width="100%" height="100%" viewBox="0 0 460 195" ${glowFilter}>
        <!-- Ground Datum Line -->
        <line x1="42" y1="162" x2="425" y2="162" stroke="#ff9d1a" stroke-width="2"/>

        ${rearCanopyMarkup}

        <!-- Main Wedge Body Silhouette of Vector W8 -->
        <path d="M 48 132
                 L 118 98
                 L 195 72
                 L 275 74
                 L 365 98
                 L 412 96
                 L 405 144
                 L 382 148
                 L 92 148
                 L 56 142 Z"
              fill="rgba(26, 13, 2, 0.65)" ${stroke}/>

        <!-- Rear Spoiler Wing -->
        <path d="M 382 97 L 415 86 L 418 96 L 392 98 Z" ${stroke}/>

        <!-- Nose & Side Strake Intake Louvers -->
        <line x1="48" y1="132" x2="88" y2="132" ${stroke}/>
        <line x1="68" y1="118" x2="94" y2="144" ${stroke}/>
        <line x1="152" y1="140" x2="312" y2="140" ${stroke}/>

        <!-- Side Engine Air Intake Gill Slats -->
        <g stroke="#ff9d1a" stroke-width="1.6">
          <line x1="286" y1="104" x2="276" y2="130"/>
          <line x1="294" y1="104" x2="284" y2="130"/>
          <line x1="302" y1="104" x2="292" y2="130"/>
          <line x1="310" y1="104" x2="300" y2="130"/>
        </g>

        ${scissorDoorMarkup}

        <!-- Front Wheel & Tire Concentric Rings -->
        <g>
          <circle cx="122" cy="136" r="26" fill="#1a0d02" ${stroke}/>
          <circle cx="122" cy="136" r="20" ${stroke}/>
          <circle cx="122" cy="136" r="13" ${stroke}/>
        </g>

        <!-- Rear Wheel & Deep-Dish Rim Rings -->
        <g>
          <circle cx="352" cy="136" r="28" fill="#1a0d02" ${stroke}/>
          <circle cx="352" cy="136" r="22" ${stroke}/>
          <circle cx="352" cy="136" r="14" ${stroke}/>
        </g>

        <!-- Status Caption when Doors Open -->
        <text x="230" y="182" text-anchor="middle" font-family="JetBrains Mono" font-size="10" font-weight="bold" fill="#ff9d1a">
          ${doorOpen || canopyOpen ? '⚠ CANOPY / SCISSOR DOOR AJAR (CLICK VEHICLE TO SEAL)' : '✓ ALL CHASSIS HATCHES SEALED & LOCKED'}
        </text>
      </svg>
    `;
  }

  // Performance Page 2 & 3 (Twin-Turbo Boost, RPM Bar Graph, Speed & Temperatures)
  function getPerformancePageSvg(pageMode) {
    const isPage2 = pageMode === 'perf1';
    return `
      <svg width="100%" height="100%" viewBox="0 0 460 195" style="filter: drop-shadow(0 0 5px rgba(255, 157, 26, 0.65));">
        <g font-family="JetBrains Mono" fill="#ff9d1a" font-weight="bold">
          <text x="20" y="28" font-size="12">${isPage2 ? 'TWIN-TURBO BOOST & POWERTRAIN' : 'EXHAUST GAS TEMP & ELECTRICAL'}</text>
          <line x1="20" y1="36" x2="440" y2="36" stroke="#ff9d1a" stroke-width="1.5"/>

          <!-- Digital Speed & RPM Readout Box -->
          <rect x="20" y="48" width="135" height="72" fill="none" stroke="#ff9d1a" stroke-width="1.5"/>
          <text x="30" y="66" font-size="10">AIRSPEED</text>
          <text x="88" y="102" font-size="34" text-anchor="middle">${isPage2 ? '142' : '980°'}</text>
          <text x="128" y="114" font-size="9">${isPage2 ? 'MPH' : 'EGT'}</text>

          <!-- Horizontal Bar Graphs -->
          <text x="175" y="62" font-size="10">TWIN-TURBO BOOST: +${boostPsi.toFixed(1)} PSI</text>
          <rect x="175" y="68" width="260" height="14" fill="none" stroke="#ff9d1a" stroke-width="1.4"/>
          <rect x="178" y="71" width="${Math.min(254, (boostPsi / 22) * 254)}" height="8" fill="#ff9d1a"/>

          <text x="175" y="106" font-size="10">ENGINE RPM: 5,850 / 7,000</text>
          <rect x="175" y="112" width="260" height="14" fill="none" stroke="#ff9d1a" stroke-width="1.4"/>
          <rect x="178" y="115" width="212" height="8" fill="#ff9d1a"/>

          <!-- Bottom 4 Telemetry Cells -->
          <text x="20" y="152" font-size="10">OIL PRESS: 64 PSI</text>
          <text x="165" y="152" font-size="10">COOLANT: 185°F</text>
          <text x="310" y="152" font-size="10">SYSTEM: 14.2 VOLTS</text>

          <text x="20" y="176" font-size="10">TRANS TEMP: 170°F</text>
          <text x="165" y="176" font-size="10">FUEL REM: 18.4 GAL</text>
          <text x="310" y="176" font-size="10">IGNITION: ARMED</text>
        </g>
      </svg>
    `;
  }

  function renderElScreen() {
    if (activeTab === 'main' || activeTab === 'chassis') {
      elViewport.innerHTML = getVectorW8WireframeSvg();
    } else {
      elViewport.innerHTML = getPerformancePageSvg(activeTab);
    }
  }

  renderElScreen();

  // Click car wireframe to open/close Scissor Door & Engine Canopy
  elViewport.addEventListener('click', () => {
    if (activeTab === 'main' || activeTab === 'chassis') {
      if (doorOpen && canopyOpen) {
        canopyOpen = false;
      } else if (doorOpen && !canopyOpen) {
        doorOpen = false;
      } else {
        doorOpen = true;
        canopyOpen = true;
      }
      renderElScreen();
    }
  });

  // Bottom 4 Soft-Key Tabs
  document.querySelectorAll('#elTabs .el-tab-cell').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#elTabs .el-tab-cell').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.tab;
      renderElScreen();
    });
  });

  // Left Gear Column (P R N D 2 1)
  document.querySelectorAll('#gearCol .el-gear-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('#gearCol .el-gear-item').forEach(g => g.classList.remove('active'));
      item.classList.add('active');
      // Automatically release Parking Brake light when shifting out of P
      const brakeCell = document.getElementById('brakeWarnCell');
      brakeCell.classList.toggle('red-active', item.dataset.g === 'P');
    });
  });

  // =========================================================================
  // 3. KORRY SWITCHES, THUMBWHEEL DIMMERS, BOOST KNOB & WARNING MATRIX
  // =========================================================================
  document.querySelectorAll('.korry-switch:not(#hazardBtn)').forEach(sw => {
    sw.addEventListener('click', () => {
      if (sw.classList.contains('lit-red')) {
        sw.classList.toggle('lit-red');
      } else {
        sw.classList.toggle('lit');
      }
    });
  });

  // Hazard Blinking Toggle
  let hazardTimer = null;
  const hazardBtn = document.getElementById('hazardBtn');
  hazardBtn.addEventListener('click', () => {
    if (hazardTimer) {
      clearInterval(hazardTimer);
      hazardTimer = null;
      hazardBtn.classList.remove('lit-red');
    } else {
      hazardBtn.classList.add('lit-red');
      hazardTimer = setInterval(() => {
        hazardBtn.classList.toggle('lit-red');
      }, 450);
    }
  });

  // Vertical Thumbwheel Dimmers (PANEL & DISPLAY)
  document.querySelectorAll('.thumbwheel-slot').forEach(slot => {
    const drum = slot.querySelector('.thumbwheel-drum');
    let dragging = false;
    let startY = 0;
    let wheelOffset = 0;
    let brightness = 1.0;

    slot.addEventListener('pointerdown', (e) => {
      dragging = true;
      startY = e.clientY;
      slot.setPointerCapture(e.pointerId);
    });

    slot.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dy = startY - e.clientY;
      startY = e.clientY;
      wheelOffset += dy;
      brightness = Math.max(0.25, Math.min(1.0, brightness + dy * 0.008));
      drum.style.setProperty('--wheel-pos', `${wheelOffset}px`);

      if (slot.dataset.wheel === 'panel') {
        document.documentElement.style.setProperty('--panel-brt', brightness.toFixed(2));
      } else {
        document.documentElement.style.setProperty('--disp-brt', brightness.toFixed(2));
      }
    });

    const stop = () => { dragging = false; };
    slot.addEventListener('pointerup', stop);
    slot.addEventListener('pointercancel', stop);
  });

  // Rotary Knobs (HUD & BOOST)
  document.querySelectorAll('.avionics-knob').forEach(knob => {
    let dragging = false;
    let startY = 0;
    let deg = parseFloat(knob.style.getPropertyValue('--k-deg')) || 0;

    knob.addEventListener('pointerdown', (e) => {
      dragging = true;
      startY = e.clientY;
      knob.setPointerCapture(e.pointerId);
    });

    knob.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dy = startY - e.clientY;
      startY = e.clientY;
      deg = Math.max(-120, Math.min(120, deg + dy * 1.8));
      knob.style.setProperty('--k-deg', `${deg}deg`);

      if (knob.dataset.knob === 'boost') {
        boostPsi = 6 + ((deg + 120) / 240) * 16;
        if (activeTab === 'perf1' || activeTab === 'perf2') renderElScreen();
      }
    });

    const stop = () => { dragging = false; };
    knob.addEventListener('pointerup', stop);
    knob.addEventListener('pointercancel', stop);
  });

  // Warning Matrix Cells Clickable
  document.querySelectorAll('#warnGrid .annunciator-cell').forEach((cell, idx) => {
    cell.addEventListener('click', () => {
      if (idx === 1) {
        cell.classList.toggle('red-active');
      } else {
        cell.classList.toggle('amber-active');
      }
    });
  });
})();
</script>
</body>
</html>
