<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRT Terminal Window</title>

<script type="application/json" data-uilab-meta>
{
  "title": "CRT Terminal Window",
  "category": "modals",
  "themes": ["retro"],
  "tags": ["crt", "terminal", "scanlines", "flicker", "bloom", "retro"],
  "description": "Retro hacker terminal window with phosphor green glow, curved screen vignette, animated scanlines, and typewriter output.",
  "techniques": ["text-shadow bloom", "repeating-linear-gradient scanlines", "screen curvature vignette", "steps() typing animation", "phosphor flicker"],
  "recipe": "Эффект ЭЛТ-монитора достигается сочетанием radial-gradient по краям (виньетка кривизны экрана) и repeating-linear-gradient поверх всего с pointer-events: none (полосы развертки/scanlines). Свечение текста строится многослойным text-shadow (зелёный люминофор P1), а курсор мигает дискретно через steps(1).",
  "preview": { "mode": "page", "width": 960, "height": 680 }
}
</script>

<style>
  :root {
    --crt-bg: #050d08;
    --crt-text: #33ff66;
    --crt-text-dim: #1a8838;
    --crt-glow: rgba(51, 255, 102, 0.45);
    --crt-border: #1f592d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #020603;
    display: grid;
    place-items: center;
    font-family: ui-monospace, "Cascadia Code", "Courier New", monospace;
    color: var(--crt-text);
    overflow: hidden;
    padding: 24px;
  }

  .terminal-window {
    position: relative;
    width: 100%;
    max-width: 820px;
    height: 520px;
    background: var(--crt-bg);
    border: 2px solid var(--crt-border);
    border-radius: 14px;
    box-shadow: 
      0 0 40px rgba(0, 255, 100, 0.15),
      inset 0 0 60px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Scanlines overlay */
  .terminal-window::before {
    content: " ";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      rgba(18, 16, 16, 0) 50%, 
      rgba(0, 0, 0, 0.35) 50%
    ), linear-gradient(
      90deg,
      rgba(255, 0, 0, 0.03),
      rgba(0, 255, 0, 0.01),
      rgba(0, 0, 255, 0.03)
    );
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
    pointer-events: none;
    opacity: 0.85;
  }

  /* CRT Screen curvature vignette */
  .terminal-window::after {
    content: " ";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
    z-index: 11;
    pointer-events: none;
  }

  .header {
    background: #091a0f;
    border-bottom: 2px solid var(--crt-border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--crt-text-dim);
    z-index: 5;
  }

  .window-dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--crt-text-dim);
    box-shadow: 0 0 6px var(--crt-glow);
  }

  .content {
    flex: 1;
    padding: 24px;
    font-size: 14.5px;
    line-height: 1.6;
    overflow-y: auto;
    z-index: 5;
    text-shadow: 
      0 0 4px var(--crt-glow),
      0 0 12px rgba(51, 255, 102, 0.3);
    animation: flicker 0.15s infinite;
  }

  .prompt-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .prompt-symbol {
    color: #88ffaa;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--crt-text);
    vertical-align: middle;
    margin-left: 4px;
    animation: blink 0.8s steps(1) infinite;
    box-shadow: 0 0 8px var(--crt-text);
  }

  .log-line {
    margin: 4px 0;
    color: var(--crt-text);
  }
  .log-dim {
    color: var(--crt-text-dim);
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @keyframes flicker {
    0% { opacity: 0.98; }
    50% { opacity: 1; }
    100% { opacity: 0.99; }
  }
</style>
</head>
<body>

<div class="terminal-window">
  <div class="header">
    <div class="window-dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <span>TERMINAL // VT-100 PHOSPHOR GREEN</span>
    <span>SYS: OK</span>
  </div>

  <div class="content">
    <div class="log-dim">&gt; SYSTEM INITIALIZATION SEQUENCE COMPLETED</div>
    <div class="log-dim">&gt; MEMORY CHECK: 640 KB BASE OK</div>
    <div class="log-dim">&gt; LOADING INTERFACE KERNEL v4.1...</div>
    <div class="log-line">&gt; CONNECTED TO CORE NETWORK (HOST: NODE-09)</div>
    <div class="log-line">&gt; STATUS: ALL SENSORS NOMINAL. AWAITING COMMAND.</div>
    <div class="prompt-line">
      <span class="prompt-symbol">operator@node-09:~$</span>
      <span id="typewriter">run diagnostics --full</span><span class="cursor"></span>
    </div>
  </div>
</div>

<script>
  const textEl = document.getElementById("typewriter");
  const command = "run diagnostics --mode=deep-scan";
  let idx = 0;
  textEl.textContent = "";

  function type() {
    if (idx < command.length) {
      textEl.textContent += command[idx];
      idx++;
      setTimeout(type, 60 + Math.random() * 60);
    }
  }
  setTimeout(type, 600);
</script>

</body>
</html>
